/* ---------- Tool wiring ---------- */
function num(id){ const v=parseFloat($("#"+id).value); return isFinite(v)?v:NaN; }
function fmtPct(p){ return isFinite(p) ? (p*100).toFixed(p>0.995||p<0.005?1:0)+"%" : "–"; }
function wirePostTest(){
  const root=$("#tool-pt"); if(!root) return;
  const calc=()=>{
    const mode=root.querySelector('input[name="ptm"]:checked').value;
    root.querySelectorAll("[data-m]").forEach(f=>f.hidden=f.dataset.m!==mode);
    const pre=num("pt-pre")/100;
    let lrp,lrn;
    if(mode==="snsp"){ const sn=num("pt-sn")/100, sp=num("pt-sp")/100; lrp = sp>=1 ? Infinity : sn/(1-sp); lrn = sp<=0 ? Infinity : (1-sn)/sp; }
    else { lrp=num("pt-lrp"); lrn=num("pt-lrn"); }
    const post=lr=>{ if(!(pre>=0&&pre<=1)||!(lr>=0)) return NaN; if(lr===Infinity) return 1; if(pre>=1) return 1; const o=pre/(1-pre)*lr; return o/(1+o); };
    const pp=post(lrp), pn=post(lrn);
    $("#pt-o-lrp").textContent = isFinite(lrp)?lrp.toFixed(2):lrp===Infinity?"∞":"–";
    $("#pt-o-lrn").textContent = isFinite(lrn)?lrn.toFixed(2):"–";
    $("#pt-o-pos").textContent = fmtPct(pp);
    $("#pt-o-neg").textContent = fmtPct(pn);
    const place=(id,p)=>{ const m=$("#"+id); m.hidden=!isFinite(p); if(isFinite(p)) m.style.left=(Math.min(1,Math.max(0,p))*100)+"%"; };
    place("pt-mk-pre",pre); place("pt-mk-pos",pp); place("pt-mk-neg",pn);
  };
  root.addEventListener("input",calc); calc();
}
function wireMcid(){
  const root=$("#tool-mcid"); if(!root) return;
  const calc=()=>{
    const b=num("mc-b"), f=num("mc-f"), m=Math.abs(num("mc-m")), up=$("#mc-d").value==="up";
    const ch=f-b, v=$("#mc-v");
    $("#mc-o-c").textContent = isFinite(ch) ? (ch>0?"+":"")+(+ch.toFixed(2)) : "–";
    $("#mc-o-p").textContent = isFinite(ch)&&b ? (ch/Math.abs(b)*100>0?"+":"")+(ch/Math.abs(b)*100).toFixed(0)+"%" : "–";
    if(!isFinite(ch)||!isFinite(m)){ v.textContent="Enter all three numbers."; v.className="verdict no"; return; }
    const better = up ? ch : -ch;
    if(better>=m){ v.textContent="Improvement meets or exceeds the MCID."; v.className="verdict yes"; }
    else if(better>0){ v.textContent="Improved, but by less than the MCID."; v.className="verdict no"; }
    else if(better===0){ v.textContent="No change."; v.className="verdict no"; }
    else { v.textContent = -better>=m ? "Worse by at least the MCID." : "Slightly worse, within the MCID."; v.className="verdict no"; }
  };
  root.addEventListener("input",calc); root.addEventListener("change",calc); calc();
}
function wireOneRm(){
  const root=$("#tool-rm"); if(!root) return;
  const calc=()=>{
    const w=num("rm-w"), r=Math.round(num("rm-r"));
    const ok = w>0 && r>=1;
    const ep = ok ? (r===1?w:w*(1+r/30)) : NaN;
    const bz = ok && r<37 ? (r===1?w:w*36/(37-r)) : NaN;
    const av = isFinite(bz) ? (ep+bz)/2 : ep;
    const f=x=>isFinite(x)?x.toFixed(1)+" kg":"–";
    $("#rm-e").textContent=f(ep); $("#rm-b").textContent=f(bz); $("#rm-a").textContent=f(av);
    $("#rm-t").innerHTML = [95,90,85,80,75,70,65,60,55,50].map(p=>`<tr><td class="rl" style="font-family:var(--f-mono)">${p}%</td><td class="num">${isFinite(av)?(av*p/100).toFixed(1):"–"}</td></tr>`).join("");
    $("#rm-n").textContent = r>10 ? "More than 10 reps: treat these estimates with caution." : "Estimates get less reliable above 10 reps.";
  };
  root.addEventListener("input",calc); calc();
}
function wireQbank(){
  const root=$("#tool-q"); if(!root) return;
  const meta=()=>{ $("#qb-meta").textContent=`Template question · ${$("#qb-type").value==="All types"?"Single best answer":$("#qb-type").value} · ${$("#qb-bank").value}`; };
  root.addEventListener("change",meta);
  root.addEventListener("click",e=>{
    const o=e.target.closest(".opt"); if(!o) return;
    root.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===o));
    $("#qb-ex").hidden=false;
  });
}
function wireCase(){
  const root=$("#tool-case"); if(!root) return;
  let cur=0;
  const show=i=>{
    cur=Math.max(0,Math.min(STAGES.length-1,i));
    root.querySelectorAll(".step").forEach((b,j)=>{ b.classList.toggle("on",j===cur); b.classList.toggle("done",j<cur); b.setAttribute("aria-selected",j===cur); });
    $("#cs-panel").innerHTML = `<div class="stage"><h4><b>${cur+1}</b>${esc(STAGES[cur][0])}</h4>${slotsHTML(STAGES[cur][1])}</div>`;
    $("#cs-prev").disabled = cur===0;
    $("#cs-next").textContent = cur===STAGES.length-1 ? "Restart case" : "Next stage";
  };
  root.addEventListener("click",e=>{
    const s=e.target.closest(".step"); if(s){ show(+s.dataset.stage); return; }
    if(e.target.closest("#cs-prev")) show(cur-1);
    if(e.target.closest("#cs-next")) show(cur===STAGES.length-1?0:cur+1);
  });
  show(0);
}
const osce = {phase:"ready",running:false,end:0,remain:0,read:2,station:8,warn:2,wake:null};
function osceDur(ph){ return Math.max(0,(ph==="reading"?osce.read:osce.station))*60000; }
function osceReset(){ osce.running=false; osce.phase="ready"; osce.remain = osceDur(osce.read>0?"reading":"station"); releaseWake(); paintOsce(); }
function releaseWake(){ try{ if(osce.wake){ osce.wake.release(); osce.wake=null; } }catch(e){} }
function osceToggle(){
  if(osce.running){ osce.running=false; osce.remain=Math.max(0,osce.end-Date.now()); releaseWake(); paintOsce(); return; }
  if(osce.phase==="ready"||osce.phase==="done"){ osce.phase = osce.read>0 ? "reading" : "station"; osce.remain = osceDur(osce.phase); }
  osce.running=true; osce.end=Date.now()+osce.remain;
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{osce.wake=l;}).catch(()=>{}); }catch(e){}
  paintOsce();
}
function osceTick(){
  if(!osce.running) return;
  osce.remain = osce.end-Date.now();
  if(osce.remain<=0){
    if(osce.phase==="reading"){ osce.phase="station"; osce.remain=osceDur("station"); osce.end=Date.now()+osce.remain; }
    else { osce.phase="done"; osce.running=false; osce.remain=0; releaseWake(); }
  }
  paintOsce();
}
function paintOsce(){
  const t=$("#os-timer"); if(!t) return;
  const secs=Math.ceil(Math.max(0,osce.remain)/1000), mm=String(Math.floor(secs/60)).padStart(2,"0"), ss=String(secs%60).padStart(2,"0");
  $("#os-clock").textContent = mm+":"+ss;
  const labels={ready:"Ready",reading:"Reading time",station:"Station",done:"Time's up"};
  $("#os-phase").textContent = labels[osce.phase]+(osce.running||osce.phase==="ready"||osce.phase==="done"?"":" · paused");
  const dur = osce.phase==="ready" ? 1 : osceDur(osce.phase==="done"?"station":osce.phase);
  $("#os-fill").style.width = (osce.phase==="ready"?0:osce.phase==="done"?100:Math.min(100,(1-osce.remain/dur)*100))+"%";
  const warn = osce.phase==="station" && osce.remain<=osce.warn*60000;
  t.className = "timer"+(osce.phase==="reading"?" reading":"")+(warn?" warn":"")+(osce.phase==="done"?" done":"");
  $("#os-start").textContent = osce.running ? "Pause" : osce.phase==="ready" ? "Start" : osce.phase==="done" ? "Restart" : "Resume";
}
setInterval(osceTick,200);
function wireOsce(){
  const root=$("#tool-osce"); if(!root) return;
  $("#os-read").value=osce.read; $("#os-station").value=osce.station; $("#os-warn").value=osce.warn;
  root.addEventListener("input",e=>{
    if(!e.target.matches("input")) return;
    const v=parseFloat(e.target.value); if(!isFinite(v)||v<0) return;
    if(e.target.id==="os-read") osce.read=v; if(e.target.id==="os-station") osce.station=Math.max(0.5,v); if(e.target.id==="os-warn") osce.warn=v;
    if(!osce.running && (osce.phase==="ready"||osce.phase==="done")) osceReset(); else paintOsce();
  });
  $("#os-start").addEventListener("click",osceToggle);
  $("#os-reset").addEventListener("click",osceReset);
  if(osce.phase==="ready" && !osce.running) osce.remain = osceDur(osce.read>0?"reading":"station");
  paintOsce();
}
function wireTool(kind){ ({posttest:wirePostTest,mcid:wireMcid,onerm:wireOneRm,qbank:wireQbank,casesim:wireCase,osce:wireOsce}[kind]||function(){})(); }

/* ---------- Anki builder ---------- */
function deckFor(n){
  if(!n) return "CliniPD";
  const parts=[...ancestors(n),n].filter(a=>a.id!=="conditions").map(labelOf);
  return ["CliniPD"].concat(parts).join("::");
}
function tagsFor(n){
  if(!n) return "CliniPD";
  const parts=[...ancestors(n)].filter(a=>a.id!=="conditions").map(labelOf).map(s=>s.replace(/&/g,"and").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,""));
  const tags=["CliniPD"]; if(parts.length) tags.push("CliniPD::"+parts.join("::"));
  if(n.flag==="red") tags.push("must-not-miss");
  return tags.join(" ");
}
function fmt(text){ return esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\r?\n/g,"<br>"); }
function plain(text){ return text.replace(/\*\*/g,"").replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g,"$1").replace(/\s+/g," ").trim(); }
function clozeFront(text){ return fmt(text).replace(/\{\{c\d+::(.*?)(::(.*?))?\}\}/g,(m,a,b,h)=>`<span class="cz">[${h?esc(h):"…"}]</span>`); }
function clozeBack(text){ return fmt(text).replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g,'<span class="cz">$1</span>'); }
function ready(c){ return c.type==="cloze" ? /\{\{c\d+::/.test(c.front) : c.front.trim()!=="" && c.back.trim()!==""; }
function tsvField(s){ s=String(s).replace(/\t/g," "); return /"/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportText(){
  const lines=["#separator:Tab","#html:true","#notetype column:1","#deck column:2","#tags column:5"];
  cards.filter(ready).forEach(c=>{ lines.push([NOTETYPE[c.type],c.deck,fmt(c.front),fmt(c.back),c.tags].map(tsvField).join("\t")); });
  return lines.join("\n")+"\n";
}

        <div class="clist" id="ak-list"></div>
        <p class="note">Cards are saved in this browser only.</p>
      </section>
      <section class="tool">
        <div class="tool-h"><h2>Export to Anki</h2><span class="note" id="ak-ready"></span></div>
        <div class="field"><label for="ak-file">File name</label><input id="ak-file" value="clinipd-cards.txt" autocomplete="off"></div>
        <div class="btns"><button class="btn pri" type="button" id="ak-dl">Download .txt</button><button class="btn" type="button" id="ak-copy">Copy file contents</button></div>
        <div class="copybox" id="ak-copybox" hidden><textarea id="ak-copytext" readonly aria-label="File contents"></textarea><p class="note">Select all, copy, paste into a plain text file saved as .txt, then import it.</p></div>
        <ol class="steps-list"><li>Open Anki on your computer (version 2.1.55 or later).</li><li>Choose File, then Import, and pick the .txt file.</li><li>Check the preview. Deck, note type and tags come from the file header. Press Import.</li></ol>
        <p class="note">Note type names must match your collection: Basic, Basic (and reversed card), Cloze.</p>
      </section>
    </div>
  </div>`;
}
function wireAnki(){
  const deck=$("#ak-deck"), tags=$("#ak-tags"), front=$("#ak-front"), back=$("#ak-back");
  const ctxNode = ()=>ankiCtx ? BY.get(ankiCtx) : null;
  const setCtx = id=>{
    ankiCtx = id; sset(CTX_KEY,id); document.dispatchEvent(new Event("ak-ctx"));
    const n=ctxNode();
    $("#ak-ctx").innerHTML = n ? `${domDot(n.dom)}<span>${esc(n.title)}</span><span class="chip">${esc(TYPE[n.type]||"Page")}</span><a href="#${n.id}">Open page</a>` : `<span>General deck</span><span class="chip">No page selected</span>`;
    deck.value = deckFor(n); tags.value = tagsFor(n);
    $("#ak-starter").disabled = !n;
    $("#ak-file").value = (n?"clinipd-"+slug(n.title):"clinipd-cards")+".txt";
  };
  const labels = ()=>{
    $("#ak-fl").textContent = ankiType==="cloze" ? "Text (wrap answers like {{c1::answer}})" : "Front";
    $("#ak-bl").textContent = ankiType==="cloze" ? "Back extra (optional)" : "Back";
    front.placeholder = ankiType==="cloze" ? "Lachman LR+ for ACL rupture is {{c1::…}}" : "Question";
    back.placeholder = ankiType==="cloze" ? "Source or context" : "Answer";
  };
  const meter = ()=>{
    const len=plain(back.value).length, m=$("#ak-meter");
    m.className = "meter"+(len>260?" long":len>160?" mid":"");
    m.querySelector(".bar span").style.width = Math.min(100,len/2.6)+"%";
    m.querySelector(".mt").textContent = len===0 ? "0 characters" : len>260 ? `${len} characters · too long, split this card` : len>160 ? `${len} characters · getting long` : `${len} characters · short`;
  };
  const preview = ()=>{
    const p=$("#ak-prev"), f=front.value.trim(), b=back.value.trim();
    if(!f && !b){ p.innerHTML='<span class="ph">Start typing to preview the card.</span>'; return; }
    if(ankiType==="cloze") p.innerHTML = showBack ? clozeBack(f)+(b?`<hr>${fmt(b)}`:"") : clozeFront(f);
    else p.innerHTML = (f?fmt(f):'<span class="ph">No front yet</span>')+(showBack?`<hr>${b?fmt(b):'<span class="ph">No back yet</span>'}`:"");
    $("#ak-flip").textContent = showBack ? "Show front" : "Show answer";
  };
  const list = ()=>{
    const el=$("#ak-list");
    el.innerHTML = cards.length ? cards.map(c=>`<div class="ci"><div class="ci-x"><div class="ci-f">${esc(plain(c.front)||"(no front)")}</div><div class="ci-d">${esc(NOTETYPE[c.type])} · ${esc(c.deck)}</div></div>${ready(c)?"":'<span class="chip amber">Needs a back</span>'}<div class="ci-a"><button class="btn sm" type="button" data-ed="${c.id}">Edit</button><button class="btn sm" type="button" data-del="${c.id}" aria-label="Delete card">Delete</button></div></div>`).join("")
      : '<div class="empty">No cards yet. Add one on the left, or add starter cards for the page.</div>';
    const r=cards.filter(ready).length, w=cards.length-r;
    $("#ak-count").textContent = plural(cards.length,"card");
    $("#ak-ready").textContent = `${r} ready${w?` · ${w} need a back and will be left out`:""}`;
    $("#ak-dl").disabled = $("#ak-copy").disabled = r===0;
    renderTabs();
  };
  const resetForm = ()=>{ editing=null; front.value=""; back.value=""; showBack=false; $("#ak-add").textContent="Add card"; $("#ak-h").textContent="New card"; meter(); preview(); };
  /* events */
  bindSearch($("#ak-find"),$("#ak-res"),id=>{ $("#ak-res").hidden=true; $("#ak-find").value=""; setCtx(id); });
  document.querySelectorAll('input[name="akt"]').forEach(r=>r.addEventListener("change",()=>{ ankiType=r.value; labels(); preview(); }));
  front.addEventListener("input",preview);
  back.addEventListener("input",()=>{ meter(); preview(); });
  $("#ak-flip").addEventListener("click",()=>{ showBack=!showBack; preview(); });
  $("#ak-clear").addEventListener("click",resetForm);
  $("#ak-add").addEventListener("click",()=>{
    const f=front.value.trim(), b=back.value.trim();
    if(!f){ toast("Write the front of the card first"); front.focus(); return; }
    if(ankiType==="cloze" && !/\{\{c\d+::/.test(f)){ toast("Cloze cards need at least one {{c1::answer}}"); front.focus(); return; }
    const data={type:ankiType,front:f,back:b,deck:deck.value.trim()||"CliniPD",tags:tags.value.trim(),ctx:ankiCtx};
    if(editing){ const c=cards.find(x=>x.id===editing); if(c) Object.assign(c,data); toast("Card saved"); }
    else { cards.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)},data)); toast("Card added"); }
    saveCards(); list(); resetForm(); front.focus();
  });
  $("#ak-starter").addEventListener("click",()=>{
    const n=ctxNode(); if(!n) return;
    const prompts = STARTERS[tplKey(n)]||STARTERS.topic;
    const have = new Set(cards.filter(c=>c.ctx===n.id).map(c=>c.front));
    let added=0;
    prompts.forEach(p=>{ const f=`**${n.title}**\n${p}${/\?$/.test(p)?"":"?"}`; if(have.has(f)) return; cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)+added,type:"basic",front:f,back:"",deck:deck.value.trim()||deckFor(n),tags:tags.value.trim(),ctx:n.id}); added++; });
    saveCards(); list(); toast(added?`${plural(added,"starter card")} added · write the backs`:"Starter cards are already in your list");
  });
  $("#ak-list").addEventListener("click",e=>{
    const ed=e.target.closest("[data-ed]"), del=e.target.closest("[data-del]");
    if(ed){ const c=cards.find(x=>x.id===ed.dataset.ed); if(!c) return; editing=c.id; ankiType=c.type; document.querySelectorAll('input[name="akt"]').forEach(r=>r.checked=r.value===c.type); labels(); front.value=c.front; back.value=c.back; deck.value=c.deck; tags.value=c.tags; $("#ak-add").textContent="Save card"; $("#ak-h").textContent="Edit card"; meter(); preview(); front.focus(); }
    if(del){ cards=cards.filter(x=>x.id!==del.dataset.del); if(editing===del.dataset.del) resetForm(); saveCards(); list(); }
  });
  let wipeArmed=false;
  $("#ak-wipe").addEventListener("click",e=>{
    if(!cards.length) return;
    if(!wipeArmed){ wipeArmed=true; e.target.textContent="Confirm delete all"; e.target.classList.add("warn"); setTimeout(()=>{ wipeArmed=false; e.target.textContent="Delete all"; e.target.classList.remove("warn"); },3500); return; }
    cards=[]; saveCards(); resetForm(); list(); wipeArmed=false; e.target.textContent="Delete all"; e.target.classList.remove("warn"); toast("All cards deleted");
  });
  const showCopy = txt=>{ $("#ak-copybox").hidden=false; const t=$("#ak-copytext"); t.value=txt; t.focus(); t.select(); };
  $("#ak-copy").addEventListener("click",()=>{
    const txt=exportText();
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast("Copied · paste into a .txt file and import it")).catch(()=>showCopy(txt)); }
    else showCopy(txt);
  });
  $("#ak-dl").addEventListener("click",async()=>{
    const txt=exportText();
    let name=($("#ak-file").value.trim()||"clinipd-cards").replace(/\.txt$/i,"")+".txt";
    const d = await getDownloads();
    if(!d){ if(!window.claude){ const u=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); const l=document.createElement("a"); l.href=u; l.download=name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast("File downloaded · import it in Anki"); return; } toast("Download isn't available here · use Copy file contents"); showCopy(txt); return; }
    try{ await d.save({filename:name,data:txt}); toast("File saved · import it in Anki"); }
    catch(err){ const code=err&&err.code; if(code==="declined") return; if(code==="rate_limited"){ toast("A save prompt is already open"); return; } toast("Couldn't save the file · use Copy file contents"); showCopy(txt); }
  });
  labels(); setCtx(ankiCtx && BY.get(ankiCtx) ? ankiCtx : null); meter(); preview(); list();
  wireAI({ctxNode,deck,tags,list});
}
const AI_ERR = {
  not_granted:"You declined Claude access for this page. Reload the page to be asked again.",
  sampling_disabled:"AI generation is turned off for this account.",
  rate_limited:"Too many requests at once. Wait a moment and try again.",
  queue_overflow:"Too many requests at once. Wait a moment and try again.",
  prompt_too_large:"Those notes are too long. Paste one section at a time.",
  invalid_json:"Claude's answer came back in the wrong format. Try again.",
  empty_completion:"Claude returned nothing. Try again.",
  refused:"Claude declined this request. Try rewording the notes or topic.",
  session_expired:"Your session expired. Reload the page and try again.",
  upstream_error:"Claude is unavailable right now. Try again shortly."
};
function aiPrompt(n,src,count,style,focus){
  const where = n ? `${n.title} (${TYPE[n.type]||"Page"}${pathText(n)?" in "+pathText(n):""})` : "General physiotherapy";
  const pageText = n && CONTENT[n.id] && CONTENT[n.id].sections ? Object.entries(CONTENT[n.id].sections).map(([k,v])=>`## ${k}\n${String(v).replace(/<[^>]+>/g," ")}`).join("\n\n") : "";
  const styleRule = style==="basic" ? "Every card is type \"basic\"." : style==="cloze" ? "Every card is type \"cloze\"." : "Use a mix: mostly \"basic\", with \"cloze\" for numbers, lists and definitions.";
  return `You write Anki flashcards for an Australian Master of Physiotherapy student preparing for exams and placement.

Topic: ${where}
${focus?`Focus on: ${focus}\n`:""}Number of cards: exactly ${count}

Rules:
- One idea per card. Fronts are specific questions a clinician would be asked, not "What is X?" trivia.
- Backs are short: 25 words or fewer, ideally a phrase or a short list. Never a paragraph.
- Bold the key term on the back with **double asterisks**.
- ${styleRule}
- Cloze cards put the whole sentence in "front" using {{c1::answer}} (use c2, c3 only for separate facts in one sentence); "back" is optional extra context of 15 words or fewer, or "".
- If the notes contain bold text (**like this**), prioritise those facts.
- If the notes contain an instruction like "Claude make a card on ...", make that card.
- Use clinical terminology and Australian spelling.
- Only state statistics (Sn, Sp, LRs, MCIDs, prevalence, dosage numbers) you are confident of. If you include a figure you are not sure of, set "verify": true.
- Do not invent references.
- Base the cards on the notes below when they are given; otherwise use established physiotherapy knowledge for the topic.

${pageText?`Page content:\n${pageText}\n\n`:""}${src?`Student's notes or request:\n${src}\n\n`:""}Return only JSON in this shape:
{"cards":[{"type":"basic","front":"...","back":"...","verify":false}]}`;
}
function wireAI(ak){
  const go=$("#ai-go"), stop=$("#ai-stop"), status=$("#ai-status"), out=$("#ai-out"), acts=$("#ai-acts");
  let gen=[], ctl=null;
  const ctxNote=()=>{ const el=$("#ai-ctxnote"); if(!el) return; const n=ak.ctxNode(); el.textContent = n ? `Cards will be made for ${n.title} and filed in the deck below.` : "Pick a page below, or describe the topic in your notes."; };
  ctxNote();
  document.addEventListener("ak-ctx",ctxNote);
  const setStatus=(t,err)=>{ status.textContent=t; status.className="ai-status"+(err?" err":""); };
  getCap("sample").then(s=>{ if(!s && !$("#ai-panel")) return; if(!s){ go.disabled=true; setStatus("AI generation works when this page is open in Claude, signed in."); } });
  const render=()=>{
    out.hidden = acts.hidden = !gen.length;
    out.innerHTML = gen.map((c,i)=>{
      const len=plain(c.back).length;
      return `<label class="gi"><input type="checkbox" data-gi="${i}"${c.keep?" checked":""}><span class="gi-x"><span class="gi-f">${c.type==="cloze"?clozeBack(c.front):fmt(c.front)}</span>${c.back?`<span class="gi-b">${fmt(c.back)}</span>`:""}<span class="gi-m"><span class="chip">${c.type==="cloze"?"Cloze":"Basic"}</span>${c.verify?'<span class="chip amber">Verify</span>':""}${len>160?'<span class="chip red">Long back</span>':""}</span></span></label>`;
    }).join("");
  };
  out.addEventListener("change",e=>{ const i=e.target.dataset.gi; if(i!==undefined) gen[+i].keep=e.target.checked; });
  stop.addEventListener("click",()=>ctl&&ctl.abort());
  $("#ai-discard").addEventListener("click",()=>{ gen=[]; render(); setStatus(""); });
  $("#ai-add").addEventListener("click",()=>{
    const pick=gen.filter(c=>c.keep); if(!pick.length){ toast("Tick at least one card"); return; }
    const n=ak.ctxNode(), t=(ak.tags.value.trim()+" ai-generated").trim();
    pick.forEach((c,i)=>cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)+i,type:c.type,front:c.front,back:c.back,deck:ak.deck.value.trim()||deckFor(n),tags:c.verify?t+" verify":t,ctx:n?n.id:null}));
    saveCards(); ak.list(); gen=[]; render(); setStatus(""); toast(`${plural(pick.length,"card")} added`);
  });
  go.addEventListener("click",async()=>{
    const src=$("#ai-src").value.trim(), n=ak.ctxNode();
    if(!src && !n){ setStatus("Paste some notes, describe a topic, or pick a page first.",true); return; }
    const sample=await getCap("sample");
    if(!sample){ setStatus("AI generation works when this page is open in Claude, signed in.",true); return; }
    const count=+$("#ai-n").value, style=$("#ai-style").value, focus=$("#ai-focus").value.trim();
    ctl=new AbortController(); go.disabled=true; stop.hidden=false; setStatus("Thinking… this can take up to a minute.");
    try{
      const res = await sample.json(aiPrompt(n,src,count,style,focus),{signal:ctl.signal,cache:false});
      const list = (res && Array.isArray(res.cards)) ? res.cards : Array.isArray(res) ? res : [];
      gen = list.map(c=>({type:c&&c.type==="cloze"?"cloze":"basic",front:String(c&&c.front||"").trim(),back:String(c&&c.back||"").trim(),verify:!!(c&&c.verify),keep:true}))
        .filter(c=>c.front && (c.type==="cloze" ? /\{\{c\d+::/.test(c.front) : c.back));
      render();
      setStatus(gen.length ? `${plural(gen.length,"card")} ready to review. Untick any you don't want.` : "No usable cards came back. Try more specific notes.", !gen.length);
    }catch(e){
      if(e && e.code==="cancelled") setStatus("Stopped.");
      else setStatus(AI_ERR[e&&e.code]||"Something went wrong. Try again.",true);
    }finally{ go.disabled=false; stop.hidden=true; ctl=null; }
  });
}
const CAPS={};
async function getCap(name){
  if(CAPS[name]) return CAPS[name];
  try{ if(window.claude && typeof window.claude.use==="function") CAPS[name] = await window.claude.use(name); }catch(e){ CAPS[name]=null; }
  return CAPS[name]||null;
}
const getDownloads=()=>getCap("downloads");

/* ---------- Glossary hover definitions ---------- */
const GKEYS=(()=>{ const m=[]; Object.keys(GLOSS).forEach(k=>{ m.push([k,k]); (GLOSS[k].a||[]).forEach(al=>m.push([al,k])); }); return m.sort((a,b)=>b[0].length-a[0].length); })();
const GMAP=new Map(GKEYS.map(([t,k])=>[t.toLowerCase(),k]));
const GRE=new RegExp("(?<![\\w-])("+GKEYS.map(([t])=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\w-])","gi");
const GLOSS_PAGE="foundations-glossary-glossary-of-physio-terms";
function markGloss(root){
  if(!root) return;
  const used=new Set();
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||n.nodeValue.length<3) return NodeFilter.FILTER_REJECT;
    let p=n.parentElement;
    while(p&&p!==root){ const t=p.tagName; if(t==="A"||t==="BUTTON"||t==="CODE"||p.classList.contains("gl")) return NodeFilter.FILTER_REJECT; p=p.parentElement; }
    return GRE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    GRE.lastIndex=0;
    const text=node.nodeValue; let out=null, last=0, m;
    while((m=GRE.exec(text))){
      const key=GMAP.get(m[0].toLowerCase());
      if(!key||used.has(key)) continue;
      used.add(key);
      out=out||document.createDocumentFragment();
      if(m.index>last) out.appendChild(document.createTextNode(text.slice(last,m.index)));
      const sp=document.createElement("span");
      sp.className="gl"; sp.tabIndex=0; sp.dataset.g=key; sp.setAttribute("role","button");
      sp.setAttribute("aria-label",m[0]+" — show definition");
      sp.textContent=m[0];
      out.appendChild(sp); last=m.index+m[0].length;
    }
    if(out){ if(last<text.length) out.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(out,node); }
  });
}
let gpop=null, gcur=null;
function hideGloss(){ if(gpop){ gpop.remove(); gpop=null; } gcur=null; }
function showGloss(el){
  const g=GLOSS[el.dataset.g]; if(!g) return;
  if(gcur===el) return;
  hideGloss(); gcur=el;
  gpop=document.createElement("div");
  gpop.className="gpop"; gpop.setAttribute("role","tooltip");
  gpop.innerHTML=`<b>${esc(el.dataset.g)}</b>${esc(g.d)}<a href="#${GLOSS_PAGE}">Open glossary</a>`;
  document.body.appendChild(gpop);
  const r=el.getBoundingClientRect(), pw=gpop.offsetWidth, ph=gpop.offsetHeight;
  let left=r.left+window.scrollX+r.width/2-pw/2;
  left=Math.max(12+window.scrollX,Math.min(left,window.scrollX+document.documentElement.clientWidth-pw-12));
  let top=r.bottom+window.scrollY+8;
  if(r.bottom+ph+16>window.innerHeight && r.top-ph-8>0) top=r.top+window.scrollY-ph-8;
  gpop.style.left=left+"px"; gpop.style.top=top+"px";
}
document.addEventListener("mouseover",e=>{ const g=e.target.closest(".gl"); if(g) showGloss(g); else if(gpop&&!e.target.closest(".gpop")) hideGloss(); });
document.addEventListener("focusin",e=>{ const g=e.target.closest&&e.target.closest(".gl"); if(g) showGloss(g); });
document.addEventListener("click",e=>{ const g=e.target.closest(".gl"); if(g){ e.preventDefault(); gcur===g?hideGloss():showGloss(g); } else if(!e.target.closest(".gpop")) hideGloss(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideGloss(); });
window.addEventListener("scroll",hideGloss,{passive:true});
window.addEventListener("resize",hideGloss);

/* ---------- Main render & routing ---------- */
function renderMain(){
  const n=state.active;
  if(n.type==="home") main.innerHTML = homeHTML();
  else if(n.type==="refs") main.innerHTML = refsHTML();
  else if(n.type==="anki"){ main.innerHTML = ankiHTML(); wireAnki(); }
  else {
    main.innerHTML = pageHTML(n); if(n.tool) wireTool(n.tool);
    if(MANIFEST[n.id] && !CONTENT[n.id]){
      loadArticle(n.id).then(c=>{
        if(!c || state.active!==n) return;
        const open=[...main.querySelectorAll("details.sec")].map(d=>d.open);
        main.innerHTML = pageHTML(n); if(n.tool) wireTool(n.tool);
        main.querySelectorAll("details.sec").forEach((d,i)=>{ if(open[i]!==undefined) d.open=open[i]; });
        hideGloss(); main.querySelectorAll(".prose").forEach(markGloss);
      });
    }
  }
  hideGloss();
  main.querySelectorAll(".prose").forEach(markGloss);
}
main.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="anki"){ ankiCtx=a.dataset.id; sset(CTX_KEY,ankiCtx); location.hash="anki"; }
  else if(act==="expand") main.querySelectorAll("details.sec").forEach(d=>d.open=true);
  else if(act==="collapse") main.querySelectorAll("details.sec").forEach(d=>d.open=false);
  else if(act==="toc"){ const d=document.getElementById("sec-"+a.dataset.sec); if(d){ d.open=true; d.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"}); } }
});
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const n=BY.get(id)||BY.get("home");
  state.active=n;
  ancestors(n).forEach(a=>expanded.add(a.id));
  if(n.kids) expanded.add(n.id);
  renderTabs(); renderSide(false); renderMain(); closeDrawer();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
/* skin picker */

const topEl=$("#top");
function setTopH(){ document.documentElement.style.setProperty("--top-h",topEl.offsetHeight+"px"); }
window.addEventListener("resize",setTopH);
setTopH();
loadManifest().then(()=>{ route(); getDownloads(); });
})();

/* ---- video slots ---- */
.vid-wrap{margin:26px 0 8px}
.vid-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}

  background:var(--surface-2);border:1px solid var(--line)}

  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;text-align:center;padding:22px;
  transition:border-color .22s,background .22s}

document.documentElement.removeAttribute("data-skin");</script>
<script>
(function(){
  var ORDER=["","slate","warm","contrast","indigo","forest","plum","crimson","ocean","graphite"];
  var NAMES={"":"Clinical","slate":"Slate","warm":"Warm","contrast":"Contrast","indigo":"Indigo",
             "forest":"Forest","plum":"Plum","crimson":"Crimson","ocean":"Ocean","graphite":"Graphite"};
  var FONTCSS={"":"Outfit:wght@300;400;500;600;700&family=Figtree:wght@400;500;600;700",
    "jakarta":"Plus+Jakarta+Sans:wght@300;400;500;600;700;800",
    "fraunces":"Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700",
    "grotesk":"Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700",
    "baskerville":"Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700",
    "dm":"DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700"};
  var SK="clinipd:scheme", FK="clinipd:font", MK="clinipd:mode";
  function get(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }

  /* load whichever font set the main site is set to */
  function loadFont(id){
    var css=FONTCSS[id]; if(!css) return;
    if(document.querySelector('link[data-font-set="'+id+'"]')) return;
    var l=document.createElement("link"); l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?family="+css+"&display=swap";
    l.setAttribute("data-font-set", id); document.head.appendChild(l);
  }
  function paintFont(v){ loadFont(v); if(v) document.documentElement.setAttribute("data-font",v);
                         else document.documentElement.removeAttribute("data-font"); }
  function paintMode(v){ if(v) document.documentElement.setAttribute("data-theme",v);
                         else document.documentElement.removeAttribute("data-theme"); }

  var btn=document.getElementById("cpScheme");
  var nameEl=btn&&btn.querySelector(".cp-scheme-name");
  function paintScheme(v){
    if(v) document.documentElement.setAttribute("data-scheme",v);
    else document.documentElement.removeAttribute("data-scheme");
    if(nameEl) nameEl.textContent=NAMES[v]||"Clinical";
  }
  paintScheme(get(SK)); paintFont(get(FK)); paintMode(get(MK));

  if(btn) btn.addEventListener("click", function(){
    var i=ORDER.indexOf(get(SK));
    var next=ORDER[(i+1)%ORDER.length];
    try{ localStorage.setItem(SK,next); }catch(e){}
    paintScheme(next);
  });
  window.addEventListener("storage", function(e){
    if(e.key===SK) paintScheme(e.newValue||"");
    if(e.key===FK) paintFont(e.newValue||"");
    if(e.key===MK) paintMode(e.newValue||"");
  });
})();
</script>
