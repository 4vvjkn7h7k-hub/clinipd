<style>
/* Layout: app shell — sticky header with library tabs, collapsible tree on the left (drawer on phones), reading column with a sticky page rail on wide screens. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#EAF0F2; --ink:#14212B; --muted:#53636E; --faint:#7F8F9B; --line:#D7DFE4; --line-2:#BFCAD2;
  --accent:#0A6A94; --accent-ink:#FFFFFF; --accent-soft:#DCEEF6;
  --red:#B3261E; --red-soft:#FBE7E4; --amber:#8A5A00; --amber-soft:#F6ECD8; --ok:#2E7346; --ok-soft:#E1F0E5;
  --scrim:rgb(10 20 28 / .45);
  --d-msk:#A04A2A; --d-neuro:#9C7400; --d-cardio:#B42340; --d-geri:#4D6479; --d-sports:#0B7C83; --d-paeds:#3F7A2C; --d-pelvic:#83407F; --d-pain:#4B50A8;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --side-w:290px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --surface:#152028; --surface-2:#1B2933; --ink:#E5ECF0; --muted:#A2B2BC; --faint:#7D909C; --line:#283843; --line-2:#3A4D5A;
    --accent:#5BB6E2; --accent-ink:#06131B; --accent-soft:#14324A;
    --red:#FF8A7E; --red-soft:#3D1D1B; --amber:#E8B25A; --amber-soft:#3A2E17; --ok:#6FCB8F; --ok-soft:#173323;
    --scrim:rgb(0 0 0 / .55);
    --d-msk:#E08A68; --d-neuro:#E0B643; --d-cardio:#F07A8E; --d-geri:#96AEC4; --d-sports:#4FC3C9; --d-paeds:#86C26F; --d-pelvic:#D08ACB; --d-pain:#9EA3EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#152028; --surface-2:#1B2933; --ink:#E5ECF0; --muted:#A2B2BC; --faint:#7D909C; --line:#283843; --line-2:#3A4D5A;
  --accent:#5BB6E2; --accent-ink:#06131B; --accent-soft:#14324A;
  --red:#FF8A7E; --red-soft:#3D1D1B; --amber:#E8B25A; --amber-soft:#3A2E17; --ok:#6FCB8F; --ok-soft:#173323;
  --scrim:rgb(0 0 0 / .55);
  --d-msk:#E08A68; --d-neuro:#E0B643; --d-cardio:#F07A8E; --d-geri:#96AEC4; --d-sports:#4FC3C9; --d-paeds:#86C26F; --d-pelvic:#D08ACB; --d-pain:#9EA3EE;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-0.01em;font-weight:600}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;min-height:58px;max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:22px;height:22px;fill:var(--accent);flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-0.015em}
.search{position:relative;flex:1;min-width:0;max-width:560px;margin-left:auto}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;max-height:min(60vh,460px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgb(0 0 0 / .16)}
.res{display:grid;gap:1px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink);cursor:pointer}
.res:hover,.res.act{background:var(--accent-soft)}
.res-t{font-weight:700;font-size:14px}
.res-p{font-size:12px;color:var(--muted)}
.res-empty{padding:10px;color:var(--muted);font-size:13.5px}
.browse{display:none;flex:none;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.browse svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tabs-band{border-top:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:1480px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:11px 11px 10px;font-weight:700;font-size:13.5px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}

/* Shell */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:34px;max-width:1480px;margin:0 auto;padding-block:24px 72px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,104px) + 16px);align-self:start;max-height:calc(100vh - var(--top-h,104px) - 32px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;padding-right:6px}
.side-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.side-h a,.side-h b{font-family:var(--f-display);font-weight:600;font-size:16.5px;color:var(--ink);text-decoration:none}
.side-h span{font:500 11.5px var(--f-mono);color:var(--faint);white-space:nowrap}
.side-tools{display:flex;justify-content:flex-end;padding:0 4px 6px}
.side-tools button{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:5px}
.side-tools button:hover{color:var(--accent)}
.btn.side-x{display:none}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.t-row{display:flex;align-items:center;gap:4px;padding:2px 6px 2px calc(var(--lvl,0) * 14px + 2px);border-radius:6px;min-height:31px}
.t-row:hover{background:var(--surface-2)}
.t-row.on{background:var(--accent-soft)}
.t-row.on .t-link{font-weight:700}
.t-car{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--faint);padding:0}
.t-car:hover{color:var(--ink);background:var(--line)}
.t-car svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s}
.t-car[aria-expanded="true"] svg{transform:rotate(90deg)}
.t-sp{flex:none;width:22px}
.t-link{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3;padding:4px 0;overflow-wrap:anywhere}
.t-n{font:11px var(--f-mono);color:var(--faint);flex:none}
.t-flag{font:700 11.5px var(--f-mono);color:var(--red);flex:none;width:10px;text-align:center}
.sdot{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent}
.sdot.s-outline{border-color:var(--amber);background:var(--amber-soft)}
.sdot.s-draft{border-color:var(--accent);background:var(--accent-soft)}
.sdot.s-reviewed{border-color:var(--ok);background:var(--ok-soft)}
.sdot.s-published{border-color:var(--ok);background:var(--ok)}
.ddot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--dc,var(--faint))}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35}

/* Page */
.page{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:32px;align-items:start}
.page-main{min-width:0}
.page-aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,104px) + 16px);display:grid;gap:12px;max-height:calc(100vh - var(--top-h,104px) - 32px);overflow:auto}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:13px;color:var(--faint);margin-bottom:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--muted)}
h1.pt{font-size:clamp(26px,3.2vw,35px);line-height:1.15;margin:8px 0 12px}
.lede-s{font-size:16px;color:var(--muted);max-width:64ch;margin:-2px 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap;flex:none}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mono{font-family:var(--f-mono);font-weight:500;font-size:11.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* Children */
.kids{margin:0 0 30px}
.kids-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.kids-h h2{font-size:20px}
.kids-h span{font:12px var(--f-mono);color:var(--faint)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:grid;gap:7px;align-content:start;padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card-t{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.25}
.card-m{font:12px var(--f-mono);color:var(--faint)}
.card-l{font-size:13px;color:var(--muted);line-height:1.45}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));column-gap:22px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.row:hover .row-t{color:var(--accent)}
.row-t{flex:1;min-width:0;font-size:14.5px;line-height:1.35}

/* Sections */
.secs-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.secs-h h2{font-size:20px}
.secs-h span{font:12px var(--f-mono);color:var(--faint)}
.secs{display:grid;gap:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;scroll-margin-top:calc(var(--top-h,104px) + env(safe-area-inset-top,0px) + 14px)}
.sec>summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none;border-radius:10px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover .sec-t{color:var(--accent)}
.sec-n{font:500 12px var(--f-mono);color:var(--faint);width:20px;flex:none;text-align:right}
.sec-t{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.3}
.sec-car{width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:2.4;flex:none;transition:transform .15s}
.sec[open] .sec-car{transform:rotate(90deg)}
.sec-b{padding:4px 16px 18px 48px;display:grid;gap:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.slot{border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.slot-l{font-weight:700;font-size:13.5px;line-height:1.35}
.slot-h{font-size:12.5px;color:var(--faint)}
.sub-h{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tpl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.tpl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tpl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--faint);vertical-align:top}
table.tpl tr:last-child td{border-bottom:0}
table.tpl td.rl{color:var(--ink);font-weight:700}
table.tpl td.num,table.tpl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.tpl.live td{color:var(--ink)}
table.tpl.narrow{min-width:420px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.phase{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;background:var(--bg)}
.phase h4{font-family:var(--f-body);font-size:13.5px;font-weight:700}
.phase .slot{background:var(--surface)}
.video{aspect-ratio:16/9;max-width:min(100%,560px);border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--faint);font-size:13px;background:var(--surface-2)}
.video svg{width:28px;height:28px;stroke:var(--faint);fill:none;stroke-width:1.8}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain .c{border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--faint)}
.chain .c.me{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.chain .arr{color:var(--faint);font-family:var(--f-mono)}
.stage{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:grid;gap:8px}
.stage h4{font-family:var(--f-body);font-size:14px;font-weight:700}
.stage h4 b{font:500 12px var(--f-mono);color:var(--faint);margin-right:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.prose{font-size:15px;line-height:1.65;max-width:68ch;min-width:0}
.sec-b>*{min-width:0}
.prose .tbl-wrap,.prose .phases,.prose ul,.prose ol{max-width:100%}
.prose ul,.prose ol{padding-left:22px;margin:0;display:grid;gap:4px}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.ev{display:grid;gap:7px}
.ev-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:baseline}
.ev-row span:last-child{font-family:var(--f-mono);font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.ev-bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.ev-bar.due span{background:var(--amber)} .ev-bar.over span{background:var(--red)}
.gl{border-bottom:1px dashed var(--accent);cursor:help;color:inherit}
.gl:hover,.gl:focus-visible{background:var(--accent-soft);border-bottom-style:solid}
.gpop{position:absolute;z-index:70;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgb(0 0 0 / .18);font-size:13.5px;line-height:1.5}
.gpop b{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.gpop a{font-size:12.5px;font-weight:700;display:inline-block;margin-top:8px}
.prose>.tbl-wrap,.prose>.phases{margin:12px 0}

/* Aside */
.acard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.acard h3{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc{display:grid;gap:1px}
.toc button{display:flex;gap:8px;text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px;font-size:13px;line-height:1.35;color:var(--ink);cursor:pointer}
.toc button b{font:500 11px var(--f-mono);color:var(--faint);width:16px;flex:none;text-align:right;padding-top:1px}
.toc button:hover{background:var(--surface-2);color:var(--accent)}
.lrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lrow:last-child{border-bottom:0}
.lrow span:last-child{font:12.5px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:99px}
.acard .btn{margin-top:10px;width:100%}

/* Home */
.hero{padding:4px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px;display:grid;gap:12px}
.hero h1{font-size:clamp(32px,4.6vw,48px);line-height:1.05;letter-spacing:-0.02em}
.tagline{font-family:var(--f-body);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:-4px 0 0}
.lede{font-size:17px;color:var(--muted);max-width:62ch}
.hero .actions{margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:34px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:2px}
.stat b{font:500 26px/1.15 var(--f-mono);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.block{margin-bottom:36px;display:grid;gap:12px}
.block>h2{font-size:21px}
.block>p{color:var(--muted);max-width:68ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .sep{color:var(--faint);font-family:var(--f-mono);font-size:13px}
.start{border:1px solid var(--accent);border-radius:12px;background:var(--surface);padding:16px 18px;display:grid;gap:10px}
.start h3{font-size:19px}
.start ol{margin:0;padding-left:22px;columns:2 220px;column-gap:28px;font-size:14px}
.start li{padding:2px 0;break-inside:avoid}
.start li a{color:var(--ink);text-decoration:none}
.start li a:hover{color:var(--accent);text-decoration:underline}
td .cell-dom{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:700}
td .cell-dom a{color:var(--ink);text-decoration:none}
td .cell-dom a:hover{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Tools */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:28px;display:grid;gap:14px;min-width:0}
.tool-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.tool-h h2{font-size:19px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{height:38px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);min-width:0;width:100%}
.field textarea{height:auto;padding:9px 10px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.out{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.o{padding:12px;border-radius:8px;background:var(--surface-2);display:grid;gap:2px}
.o b{font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.o span{font-size:12.5px;color:var(--muted)}
.ex-note{font-size:12.5px;color:var(--amber);font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg label+label span{border-left:1px solid var(--line-2)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-3px}
.pbar{position:relative;height:28px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.pbar .mk{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px}
.mk-pre{background:var(--muted)} .mk-pos{background:var(--red)} .mk-neg{background:var(--ok)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
.verdict{padding:12px 14px;border-radius:8px;font-weight:700;font-size:14.5px}
.verdict.yes{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--amber-soft);color:var(--amber)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* Qbank */
.q{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;background:var(--bg)}
.q-meta{font:12px var(--f-mono);color:var(--faint)}
.q-stem{font-size:15.5px}
.q-lead{font-weight:700}
.q-opts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--muted)}
.opt b{font:500 13px var(--f-mono);color:var(--ink);width:16px;flex:none}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.q-ex{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}

/* Case stepper */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.step b{font:500 11.5px var(--f-mono);color:var(--faint)}
.step.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.step.done{color:var(--ink)}

/* OSCE timer */
.timer{display:grid;gap:12px;justify-items:center;padding:22px 16px;border-radius:10px;background:var(--surface-2)}
.t-phase{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-clock{font:500 clamp(56px,13vw,104px)/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-0.04em}
.timer.reading .t-phase{color:var(--accent)}
.timer.warn .t-clock,.timer.warn .t-phase{color:var(--amber)}
.timer.done .t-clock,.timer.done .t-phase{color:var(--red)}
.t-bar{width:100%;max-width:520px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.t-bar span{display:block;height:100%;width:0;background:var(--accent)}
.timer.warn .t-bar span{background:var(--amber)}

/* Anki */
.anki{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.anki .tool{margin-bottom:0}
.stack{display:grid;gap:20px;min-width:0}
.ctx{display:grid;gap:6px;padding:12px;border-radius:8px;background:var(--surface-2)}
.ctx-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:700}
.ctx-v a{font-size:13px;font-weight:700}
.ctx .search{max-width:none;margin:0}
.ctx .search input{background:var(--surface)}
.akcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:22px 18px;text-align:center;font-size:17px;line-height:1.5;min-height:150px;overflow-wrap:anywhere}
.akcard hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.akcard .cz{color:var(--accent);font-weight:700}
.akcard .ph{color:var(--faint);font-size:14px}
.meter{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.meter .bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter .bar span{display:block;height:100%;width:0;border-radius:99px;background:var(--ok)}
.meter.mid .bar span{background:var(--amber)} .meter.mid .mt{color:var(--amber)}
.meter.long .bar span{background:var(--red)} .meter.long .mt{color:var(--red)}
.clist{display:grid;gap:6px;max-height:420px;overflow:auto}
.ci{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ci-x{flex:1;min-width:0;display:grid;gap:2px}
.ci-f{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-d{font:11.5px var(--f-mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-a{display:flex;gap:6px;flex:none}
.empty{padding:16px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);font-size:13.5px;text-align:center}
.copybox textarea{width:100%;height:150px;font:12px/1.45 var(--f-mono);padding:10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2);resize:vertical}
.ai{border:1px solid var(--accent);margin-bottom:20px}
.ai-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.ai-grid{grid-template-columns:minmax(0,1fr)}}
.ai-opts{display:grid;gap:10px;align-content:start}
.ai-status{font-size:13.5px;color:var(--muted);min-height:20px}
.ai-status.err{color:var(--red);font-weight:700}
.gen{display:grid;gap:8px}
.gi{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.gi input[type=checkbox]{margin-top:4px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.gi-x{flex:1;min-width:0;display:grid;gap:4px}
.gi-f{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.gi-b{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.gi-m{display:flex;flex-wrap:wrap;gap:6px}
ol.steps-list{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 30px rgb(0 0 0 / .2)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}

@media (max-width:1200px){
  .page{grid-template-columns:minmax(0,1fr)}
  .page-aside{position:static;max-height:none;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));margin-top:20px}
  .page-aside .toc-card{display:none}
}
@media (max-width:1100px){ .anki{grid-template-columns:minmax(0,1fr)} }
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:18px 64px}
  .browse{display:inline-flex}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(88vw,350px);max-height:none;background:var(--surface);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 20px) max(14px,env(safe-area-inset-left,0px));
    transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
  .side.open{transform:none;visibility:visible;transition:transform .22s ease}
  .btn.side-x{display:inline-flex}
}
@media (max-width:640px){
  .results{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
  .sec-b{padding-left:16px}
  .sec>summary{padding:12px 14px}
  .sec-n{width:16px}
  .tool{padding:14px}
}
@media (max-width:480px){
  .browse span{display:none}
  .browse{padding:0 10px}
  .brand b{font-size:16.5px}
  .top-row{gap:10px}
}

/* ---------- Theme variants (preview) ---------- */
:root[data-skin="editorial"]{
  --bg:#F7F4EE; --surface:#FFFDF8; --surface-2:#EFEAE0; --ink:#1F1C17; --muted:#5A5347; --faint:#8A8275; --line:#E0D9CB; --line-2:#CBC2B0;
  --accent:#27503F; --accent-ink:#FFFDF8; --accent-soft:#DDE8E1;

  --f-display:"Newsreader", Georgia, serif;
  --f-body:"Source Serif 4", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}

}
:root[data-skin="editorial"] .prose{font-size:16.5px;line-height:1.72}

:root[data-skin="dense"]{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#E9EDF1; --ink:#121619; --muted:#4D5358; --faint:#767C82; --line:#DDE1E6; --line-2:#C1C7CD;

  --f-display:"IBM Plex Sans", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root[data-skin="dense"]:not([data-theme="light"]){
  --bg:#0C0F12; --surface:#141A1F; --surface-2:#1C242B; --ink:#E6EBF0; --muted:#9BA6B0; --faint:#747F89; --line:#242D35; --line-2:#36424C;
  --accent:#6A9BFF; --accent-ink:#06101F; --accent-soft:#16294A;
  --red:#FF8389; --red-soft:#3A1619; --amber:#E0B050; --amber-soft:#332814; --ok:#5FD08A; --ok-soft:#133022;
}}
:root[data-skin="dense"][data-theme="dark"]{
  --bg:#0C0F12; --surface:#141A1F; --surface-2:#1C242B; --ink:#E6EBF0; --muted:#9BA6B0; --faint:#747F89; --line:#242D35; --line-2:#36424C;
  --accent:#6A9BFF; --accent-ink:#06101F; --accent-soft:#16294A;
  --red:#FF8389; --red-soft:#3A1619; --amber:#E0B050; --amber-soft:#332814; --ok:#5FD08A; --ok-soft:#133022;
}
:root[data-skin="dense"] body{font-size:14px}
:root[data-skin="dense"] .prose{font-size:14.5px;line-height:1.58}
:root[data-skin="dense"] table.tpl{font-size:13px}
:root[data-skin="dense"] table.tpl td{padding:6px 9px}
:root[data-skin="dense"] .sec>summary{padding:10px 14px}
:root[data-skin="dense"] .sec-b{padding-bottom:14px}
:root[data-skin="dense"] .sec,:root[data-skin="dense"] .acard,:root[data-skin="dense"] .card,:root[data-skin="dense"] .tbl-wrap{border-radius:4px}
:root[data-skin="dense"] .chip{border-radius:3px}

:root[data-skin="mono"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F5; --ink:#18181B; --muted:#52525B; --faint:#8E8E96; --line:#E7E7EA; --line-2:#D1D1D6;
  --accent:#18181B; --accent-ink:#FFFFFF; --accent-soft:#EFEFF1;
  --red:#B4232A; --red-soft:#FBE8E9; --amber:#8A5A00; --amber-soft:#F7ECD8; --ok:#15713F; --ok-soft:#E0F0E7;
  --f-display:"Libre Franklin", system-ui, sans-serif;
  --f-body:"Libre Franklin", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root[data-skin="mono"]:not([data-theme="light"]){
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1C1C1F; --ink:#FAFAFA; --muted:#A1A1AA; --faint:#71717A; --line:#26262A; --line-2:#3A3A40;
  --accent:#FAFAFA; --accent-ink:#0A0A0B; --accent-soft:#242428;
  --red:#FF8A90; --red-soft:#3A1A1C; --amber:#E2B45C; --amber-soft:#332913; --ok:#63CE92; --ok-soft:#133124;
}}
:root[data-skin="mono"][data-theme="dark"]{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1C1C1F; --ink:#FAFAFA; --muted:#A1A1AA; --faint:#71717A; --line:#26262A; --line-2:#3A3A40;
  --accent:#FAFAFA; --accent-ink:#0A0A0B; --accent-soft:#242428;
  --red:#FF8A90; --red-soft:#3A1A1C; --amber:#E2B45C; --amber-soft:#332913; --ok:#63CE92; --ok-soft:#133124;
}
:root[data-skin="mono"] h1.pt{font-weight:700;letter-spacing:-0.025em}
:root[data-skin="mono"] .sec,:root[data-skin="mono"] .acard,:root[data-skin="mono"] .card{border-radius:12px}
:root[data-skin="mono"] .prose{font-size:15.5px;line-height:1.68}

:root[data-skin="clinipd"]{
  --bg:#FBFAF6; --surface:#FFFDF8; --surface-2:#EFF3EE; --ink:#203C3B; --muted:#5E6F6C; --faint:#8E9B97; --line:#D8E1DC; --line-2:#BDCDC6;

2\u0080\u0094 fear-avoidance, low self-efficacy, catastrophising, unhelpful beliefs about pain."},"nociceptive pain":{"d":"Pain arising from actual or threatened damage to non-neural tissue, driven by activation of nociceptors. Typically proportionate to load and eases with rest."},"neuropathic pain":{"d":"Pain caused by a lesion or disease of the somatosensory nervous system. Often burning or shooting, in a neuroanatomically plausible distribution."},"nociplastic pain":{"d":"Pain arising from altered nociception without clear tissue damage or somatosensory lesion. The third mechanistic descriptor recognised by the IASP."},"central sensitisation":{"d":"Increased responsiveness of central nociceptive neurons to normal or subthreshold input. Clinically: widespread, disproportionate, slow-settling pain."},"allodynia":{"d":"Pain from a stimulus that does not normally provoke pain \u00e2\u0080\u0094 light touch, clothing, a breeze."},"hyperalgesia":{"d":"An exaggerated pain response to a stimulus that is normally painful."},"kinesiophobia":{"d":"Fear of movement or re-injury. Measured with the Tampa Scale and a consistent predictor of poorer outcome."},"catastrophising":{"d":"An exaggerated negative orientation toward pain \u00e2\u0080\u0094 rumination, magnification and helplessness. Strongly predicts persistent disability."},"graded exposure":{"d":"Progressively confronting feared movements in a planned way, targeting the fear rather than the tissue."},"sensitivity":{"d":"The proportion of people WITH the condition that a test correctly identifies. A highly sensitive test, when negative, helps rule the condition out."},"specificity":{"d":"The proportion of people WITHOUT the condition that a test correctly clears. A highly specific test, when positive, helps rule the condition in."},"likelihood ratio":{"d":"How much a test result shifts the probability of a condition. Above 10 or below 0.1 produces large, often decisive shifts."},"pre-test probability":{"d":"Your estimate that the condition is present before testing \u00e2\u0080\u0094 from prevalence, history and examination. Test results modify it; they don't replace it."},"post-test probability":{"d":"The revised probability of a condition after a test result has been applied to the pre-test probability."},"MCID":{"d":"Minimal Clinically Important Difference \u00e2\u0080\u0094 the smallest change in a score that a patient would consider worthwhile."},"MDC":{"d":"Minimal Detectable Change \u00e2\u0080\u0094 the smallest change exceeding measurement error. A change below the MDC cannot be distinguished from noise."},"PROM":{"d":"Patient-Reported Outcome Measure \u00e2\u0080\u0094 a questionnaire completed by the patient about their own symptoms, function or quality of life."},"NPRS":{"d":"Numeric Pain Rating Scale \u00e2\u0080\u0094 pain rated 0 to 10. MCID is roughly 2 points in most musculoskeletal populations."},"VAS":{"d":"Visual Analogue Scale \u00e2\u0080\u0094 pain marked on a 100 mm line. Comparable to the NPRS but more sensitive to small change."},"AKPS":{"d":"Anterior Knee Pain Scale (Kujala) \u00e2\u0080\u0094 a 13-item, 100-point measure of patellofemoral symptoms and function."},"KOOS":{"d":"Knee injury and Osteoarthritis Outcome Score \u00e2\u0080\u0094 five subscales covering pain, symptoms, daily living, sport and quality of life."},"confidence interval":{"d":"The range within which the true value plausibly lies. A wide interval means the estimate is imprecise, whatever the point estimate says."},"effect size":{"d":"How large a difference is, independent of sample size. Roughly: 0.2 small, 0.5 moderate, 0.8 large."},"number needed to treat":{"d":"How many people must receive an intervention for one additional person to benefit. Lower is better."},"systematic review":{"d":"A review that searches, appraises and synthesises all eligible studies to a pre-specified protocol \u00e2\u0080\u0094 not the same as a narrative review."},"randomised controlled trial":{"d":"A trial allocating participants to groups by chance, which balances known and unknown confounders. The strongest single-study design for effectiveness."},"eccentric":{"d":"A muscle action where the muscle lengthens under load. Produces higher force and more delayed-onset soreness than concentric work."},"concentric":{"d":"A muscle action where the muscle shortens under load."},"isometric":{"d":"A muscle action producing force with no change in muscle length. Often used for analgesia and early loading in tendinopathy."},"plyometric":{"d":"Training using a rapid stretch-shortening cycle \u00e2\u0080\u0094 jumping, hopping, bounding \u00e2\u0080\u0094 to develop reactive strength."},"1RM":{"d":"One-repetition maximum \u00e2\u0080\u0094 the heaviest load that can be lifted once with acceptable technique. Used to prescribe relative intensity."},"RPE":{"d":"Rating of Perceived Exertion \u00e2\u0080\u0094 how hard an effort felt, typically 0 to 10. Allows load to self-adjust on bad days."},"MVC":{"d":"Maximal Voluntary Contraction \u00e2\u0080\u0094 the greatest force a muscle can generate voluntarily. Used as a reference for prescribing intensity."},"load capacity":{"d":"How much load a tissue can tolerate before symptoms. Rehabilitation raises capacity; management reduces demand until the two meet."},"proprioception":{"d":"The sense of joint position and movement, from receptors in muscle, tendon, joint capsule and skin."},"progressive overload":{"d":"Gradually increasing demand so tissue continues to adapt. Without it, strength gains plateau."},"time under tension":{"d":"The total duration a muscle is loaded during a set. A common variable for tendon loading protocols."},"valgus":{"d":"Angulation where the distal segment deviates away from the midline \u00e2\u0080\u0094 knock-kneed at the knee."},"varus":{"d":"Angulation where the distal segment deviates toward the midline \u00e2\u0080\u0094 bow-legged at the knee."},"crepitus":{"d":"Audible or palpable grating, clicking or crackling in a joint. Common, usually benign, and poorly correlated with pathology."},"effusion":{"d":"Excess fluid within a joint capsule. Graded by sweep test; a large tense effusion after trauma suggests haemarthrosis."},"haemarthrosis":{"d":"Blood within a joint, usually appearing within two hours of injury. Strongly suggests ACL rupture, fracture or patellar dislocation."},"retropatellar":{"d":"Behind the patella \u00e2\u0080\u0094 describing pain arising from the patellofemoral joint surface."},"peripatellar":{"d":"Around the margins of the patella."},"trochlea":{"d":"The grooved articular surface of the distal femur in which the patella tracks."},"theatre sign":{"d":"Anterior knee pain after prolonged sitting with the knee flexed. Characteristic of patellofemoral pain."},"apprehension":{"d":"A patient's protective reaction and fear during a test that threatens joint stability \u00e2\u0080\u0094 a positive finding in itself."},"antalgic gait":{"d":"A limp adopted to reduce time or load on a painful limb, shortening the stance phase on that side."},"Trendelenburg sign":{"d":"Pelvic drop on the unsupported side during single-leg stance, indicating hip abductor weakness on the stance side."},"dermatome":{"d":"The area of skin supplied by a single spinal nerve root. Used to localise radicular involvement."},"myotome":{"d":"The group of muscles supplied by a single spinal nerve root. Tested by resisted contraction."},"radiculopathy":{"d":"Dysfunction of a spinal nerve root producing pain, sensory change, weakness or reflex loss in that root's distribution."},"referred pain":{"d":"Pain felt away from its source, without nerve root involvement. Typically vague, non-dermatomal and deep."},"auscultation":{"d":"Listening to breath or heart sounds with a stethoscope to identify added sounds, reduced air entry or abnormal rhythm."},"atelectasis":{"d":"Collapse of alveoli or a lung segment, reducing gas exchange. Common after surgery and responsive to lung volume strategies."},"SpO2":{"d":"Peripheral oxygen saturation measured by pulse oximetry. Unreliable with poor perfusion, movement, or carbon monoxide."},"tidal volume":{"d":"The volume of air moved in a single normal breath \u00e2\u0080\u0094 roughly 500 ml in an adult at rest."},"ACBT":{"d":"Active Cycle of Breathing Technique \u00e2\u0080\u0094 breathing control, thoracic expansion and forced expiration, cycled to clear secretions."},"PEP":{"d":"Positive Expiratory Pressure \u00e2\u0080\u0094 exhaling against resistance to splint airways open and mobilise secretions."},"dyspnoea":{"d":"The subjective sensation of breathlessness. Not reliably proportional to oxygen saturation."},"spasticity":{"d":"Velocity-dependent increase in muscle tone from upper motor neuron lesion \u00e2\u0080\u0094 faster passive movement meets more resistance."},"hemiplegia":{"d":"Complete paralysis of one side of the body, usually following stroke or brain injury."},"hemiparesis":{"d":"Weakness, rather than complete paralysis, of one side of the body."},"ataxia":{"d":"Impaired coordination of voluntary movement, typically from cerebellar dysfunction. Produces inaccurate, poorly timed movement."},"neglect":{"d":"Failure to attend to one side of space or body, most often after right hemisphere stroke. Distinct from a visual field loss."},"BPPV":{"d":"Benign Paroxysmal Positional Vertigo \u00e2\u0080\u0094 brief positional vertigo from displaced otoconia in a semicircular canal. Highly treatable."},"nystagmus":{"d":"Involuntary rhythmic eye movement. Its direction and behaviour help localise vestibular pathology."},"CPD":{"d":"Continuing Professional Development. Physiotherapists registered in Australia must complete 20 hours each year and keep a portfolio for five years."},"Ahpra":{"d":"The Australian Health Practitioner Regulation Agency \u00e2\u0080\u0094 administers registration and accreditation for regulated health professions."},"scope of practice":{"d":"The range of activities a practitioner is educated, competent and authorised to perform."},"SUFE":{"d":"Slipped Upper Femoral Epiphysis \u00e2\u0080\u0094 displacement through the proximal femoral growth plate in adolescents. A must-not-miss cause of hip or knee pain."},"RED-S":{"d":"Relative Energy Deficiency in Sport \u00e2\u0080\u0094 impaired function across multiple systems from low energy availability."},"prognosis":{"d":"The expected course and outcome of a condition \u00e2\u0080\u0094 what you can honestly tell a patient on day one."},"collagen":{"d":"The main structural protein of tendon, ligament, bone and skin. Type I dominates tendon and bone; type II dominates articular cartilage."},"tenocyte":{"d":"The resident cell of tendon. Produces and maintains collagen and ground substance, and responds to mechanical load."},"fibroblast":{"d":"The cell that lays down collagen and extracellular matrix during repair. Becomes a myofibroblast during contraction of a healing wound."},"extracellular matrix":{"d":"The non-cellular scaffold around cells \u00e2\u0080\u0094 collagen, elastin, proteoglycans and water. Its composition determines a tissue's mechanical behaviour."},"proteoglycan":{"d":"A heavily glycosylated protein that binds water in cartilage and tendon, giving the tissue its compressive stiffness."},"synovium":{"d":"The membrane lining a joint cavity. Produces synovial fluid and is the primary site of inflammation in inflammatory arthritis."},"articular cartilage":{"d":"The hyaline cartilage covering joint surfaces. Avascular, aneural, and has very limited capacity to heal once damaged."},"subchondral bone":{"d":"The bone immediately beneath articular cartilage. Richly innervated \u00e2\u0080\u0094 a likely pain source in osteoarthritis, where the cartilage itself is not."},"enthesis":{"d":"The attachment of tendon or ligament to bone. A transitional zone of fibrocartilage, and a common site of overuse pathology."},"periosteum":{"d":"The vascular, densely innervated membrane covering bone. Highly pain-sensitive, which is why bone stress injury hurts so specifically."},"fascia":{"d":"Sheets of connective tissue that envelop and separate muscles and organs, transmitting force between them."},"sarcomere":{"d":"The contractile unit of skeletal muscle. Its length determines how much force a muscle can generate at a given joint angle."},"motor unit":{"d":"A single motor neuron and every muscle fibre it supplies. Force is graded by recruiting more units and firing them faster."},"size principle":{"d":"Motor units are recruited smallest-first. Heavy or rapid effort is required to recruit the largest, fastest, most trainable units."},"muscle spindle":{"d":"A stretch receptor inside muscle that senses length and rate of change. The afferent limb of the stretch reflex."},"Golgi tendon organ":{"d":"A receptor at the musculotendinous junction sensing tension. Inhibits its own muscle when tension is high."},"reciprocal inhibition":{"d":"Contraction of a muscle is accompanied by reflex inhibition of its antagonist."},"stretch-shortening cycle":{"d":"A rapid eccentric contraction immediately followed by a concentric one. Stores and returns elastic energy, producing more force than concentric alone."},"cross-bridge":{"d":"The myosin head binding to actin. Cycling cross-bridges shorten the sarcomere and generate force."},"hypertrophy":{"d":"Increase in muscle cross-sectional area from added contractile protein. Distinct from early strength gains, which are mostly neural."},"atrophy":{"d":"Loss of muscle mass from disuse, denervation, ageing or illness. Begins within days of immobilisation."},"neuroplasticity":{"d":"The nervous system's capacity to reorganise structure and function in response to experience, training or injury. The basis of neurological rehabilitation."},"motor learning":{"d":"The relatively permanent change in movement capability from practice. Driven by task specificity, repetition and meaningful feedback."},"DOMS":{"d":"Delayed Onset Muscle Soreness \u00e2\u0080\u0094 soreness peaking 24 to 72 hours after unaccustomed eccentric work. Normal, self-limiting, and not tissue damage."},"VO2 max":{"d":"The maximum rate of oxygen consumption during incremental exercise. The standard measure of aerobic capacity."},"lactate threshold":{"d":"The exercise intensity at which blood lactate begins rising disproportionately. A strong predictor of endurance performance."},"homeostasis":{"d":"The maintenance of a stable internal environment. Training works by disturbing it enough to provoke adaptation."},"inflammation":{"d":"The vascular and cellular response to injury \u00e2\u0080\u0094 redness, heat, swelling, pain and loss of function. Necessary for repair, harmful when prolonged."},"oedema":{"d":"Excess fluid in the interstitial space. Limits range, inhibits muscle reflexively, and slows healing if it persists."},"fibrosis":{"d":"Excess deposition of disorganised collagen during repair, producing stiffness and reduced tissue compliance."},"necrosis":{"d":"Uncontrolled cell death from injury, with inflammation. Distinct from apoptosis, which is programmed and orderly."},"ischaemia":{"d":"Inadequate blood supply to a tissue relative to its demand. Produces pain, dysfunction and, if prolonged, infarction."},"infarction":{"d":"Tissue death caused by loss of blood supply."},"tendinopathy":{"d":"Persistent tendon pain and loss of function with load. A failed healing response and disorganised matrix, not primarily inflammation \u00e2\u0080\u0094 which is why 'tendinitis' is outdated."},"degeneration":{"d":"Progressive structural deterioration of tissue. Common on imaging in asymptomatic people, so a poor explanation for pain on its own."},"osteophyte":{"d":"A bony outgrowth at a joint margin, formed in response to altered load. A radiographic feature of osteoarthritis, not a pain source in itself."},"subluxation":{"d":"Partial, transient loss of joint congruity that reduces spontaneously \u00e2\u0080\u0094 distinct from a dislocation, which does not."},"dislocation":{"d":"Complete loss of contact between joint surfaces, requiring reduction."},"avulsion":{"d":"A tendon or ligament pulling away taking a fragment of bone with it. More common than mid-substance rupture in skeletally immature patients."},"bone stress injury":{"d":"A spectrum from stress reaction to stress fracture, caused by load exceeding the bone's capacity to remodel."},"osteoporosis":{"d":"Reduced bone mineral density and disrupted microarchitecture, raising fracture risk. Responsive to progressive resistance and impact loading."},"sarcopenia":{"d":"Age-related loss of muscle mass, strength and function. A central driver of frailty, and reversible with resistance training."},"contracture":{"d":"Fixed shortening of soft tissue limiting passive range. Develops quickly in immobilised or spastic limbs."},"heterotopic ossification":{"d":"Bone forming in soft tissue where it should not, often after trauma, burns or neurological injury. Presents as rapidly reducing range with a firm end-feel."},"compartment syndrome":{"d":"Raised pressure within a closed fascial compartment compromising perfusion. Acute compartment syndrome is a surgical emergency."},"haemostasis":{"d":"The first phase of healing \u00e2\u0080\u0094 vasoconstriction and clot formation, over minutes to hours."},"proliferation":{"d":"The healing phase from roughly day three to three weeks, where fibroblasts lay down disorganised type III collagen and new vessels form."},"remodelling":{"d":"The final healing phase, from weeks to over a year, where collagen reorganises along lines of stress and converts from type III to type I. The phase loading most influences."},"granulation tissue":{"d":"New connective tissue and capillaries formed during proliferation \u00e2\u0080\u0094 fragile, and the substrate for later remodelling."},"angiogenesis":{"d":"Formation of new blood vessels, essential to repair and a feature of tendinopathy where it is often accompanied by nerve ingrowth."},"m /* ---------- Normalise the tree ---------- */
const BY = new Map(), ALL = [];
function slug(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function norm(n,parent,tab){
  n.parent = parent||null; n.tab = tab;
  if(!n.dom && parent) n.dom = parent.dom;
  if(!n.id){
    const base = (parent?parent.id+"-":"")+slug(n.title);
    let id = base, i = 2;
    while(BY.has(id)) id = base+"-"+(i++);
    n.id = id;
  }
  BY.set(n.id,n); ALL.push(n);
  n.leafCount = 0; n.pageCount = 1;
  if(n.kids) n.kids.forEach(k=>{ norm(k,n,tab); n.leafCount += k.kids ? k.leafCount : 1; n.pageCount += k.pageCount; });
}
TABS.forEach(t=>norm(t,null,t));
const PAGES = ALL.filter(n=>!["home","refs","anki"].includes(n.type));

const CARET = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2.5 7.5 6 4 9.5"/></svg>';

function ancestors(n){ const a=[]; let p=n.parent; while(p){ a.unshift(p); p=p.parent; } return a; }
function labelOf(a){ return a.type==="domain" ? DOM[a.dom].short : a.title; }
function pathText(n){ return ancestors(n).map(labelOf).join(" › "); }
function statusOf(n){ const m=MANIFEST[n.id]; return STATUS[n.id] || (m ? (m.status||"draft") : "empty"); }
function writtenIn(n){ if(!n.kids) return statusOf(n)!=="empty"?1:0; return n.kids.reduce((a,k)=>a+writtenIn(k),0); }
function refCount(n){ const m=MANIFEST[n.id]; return m ? (m.refs||0) : 0; }
function walk(n,fn){ fn(n); if(n.kids) n.kids.forEach(k=>walk(k,fn)); }
function refStats(n){ let pages=0,withRefs=0,refs=0; walk(n,x=>{ pages++; const r=refCount(x); refs+=r; if(r) withRefs++; }); return {pages,withRefs,refs}; }
function tplKey(n){ if(n.type==="group") return n.tab.id==="conditions" ? "cgroup" : "collection"; return n.type; }
function tplFor(n){ return TPL[tplKey(n)] || TPL.collection; }
function domDot(dom){ return dom ? `<span class="ddot" style="--dc:var(--d-${dom})"></span>` : ""; }
function flagChip(n){ return n.flag==="red" ? '<span class="chip red">Must not miss</span>' : n.flag==="postop" ? '<span class="chip amber">Post-op</span>' : ""; }
function statusChip(n){ const s=statusOf(n); const cls = s==="empty"?"":s==="outline"?"amber":s==="draft"?"acc":"ok"; return `<span class="chip ${cls}">${STAT[s]}</span>`; }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
const NOW = new Date();
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d){ return d ? MONTHS[d.getMonth()]+" "+d.getFullYear() : "—"; }
function newestSource(n){ const m=MANIFEST[n.id]; return m && m.newestSource ? m.newestSource : null; }
function evidence(n){
  const refs=refCount(n);
  if(!refs) return null;
  const m=MANIFEST[n.id], on=m&&m.reviewed?new Date(m.reviewed):null;
  let due=null, state="unreviewed", monthsLeft=null;
  if(on){
    due=new Date(on.getTime()); due.setMonth(due.getMonth()+REVIEW_MONTHS);
    monthsLeft=(due.getFullYear()-NOW.getFullYear())*12+(due.getMonth()-NOW.getMonth());
    state = monthsLeft<0 ? "overdue" : monthsLeft<=3 ? "due" : "current";
  }
  const src=newestSource(n);
  const srcAge = src ? NOW.getFullYear()-src : null;
  return {refs,on,due,state,monthsLeft,src,srcAge,stale:srcAge!==null&&srcAge>SOURCE_STALE_YEARS,by:m&&m.reviewedBy};
}
function evChip(n){
  const e=evidence(n); if(!e) return "";
  const cls = e.state==="overdue" ? "red" : e.state==="due" ? "amber" : e.state==="current" ? "ok" : "";
  const label = e.state==="overdue" ? "Review overdue" : e.state==="due" ? "Review due "+fmtDate(e.due) : e.state==="current" ? "Reviewed "+fmtDate(e.on) : "Not yet reviewed";
  return `<span class="chip ${cls}">${label}</span>`+(e.src?`<span class="chip mono${e.stale?" amber":""}">Sources to ${e.src}</span>`:"");
}

/* ---------- Search ---------- */
function searchNodes(q){
  const terms = q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  const hits=[];
  for(const n of ALL){
    if(n.type==="home") continue;
    if(!n.hay) n.hay = (n.title+" "+pathText(n)+" "+(TYPE[n.type]||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    if(terms.every(t=>n.hay.includes(t))){
      const tl = n.title.toLowerCase();
      const score = (tl.startsWith(terms[0])?0:tl.includes(terms[0])?1:2) + (n.kids?0.5:0);
      hits.push([score,n]);
    }
  }
  hits.sort((a,b)=>a[0]-b[0] || a[1].title.length-b[1].title.length);
  return hits.slice(0,40).map(h=>h[1]);
}
function resultsHTML(list){
  if(!list.length) return '<div class="res-empty">No pages match. Try a shorter word.</div>';
  return list.map((n,i)=>`<a class="res${i===0?" act":""}" role="option" href="#${n.id}" data-id="${n.id}"><span class="res-t">${esc(n.title)}</span><span class="res-p">${esc(TYPE[n.type]||"Page")}${pathText(n)?" · "+esc(pathText(n)):""}</span></a>`).join("");
}
function bindSearch(input,box,onPick){
  input.addEventListener("input",()=>{
    const q=input.value.trim();
    if(!q){ box.hidden=true; box.innerHTML=""; return; }
    box.innerHTML = resultsHTML(searchNodes(q)); box.hidden=false;
  });
  input.addEventListener("keydown",e=>{
    const items=[...box.querySelectorAll(".res")];
    if(e.key==="Escape"){ box.hidden=true; input.blur(); return; }
    if(box.hidden || !items.length) return;
    let i = items.findIndex(x=>x.classList.contains("act"));
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      items[i]&&items[i].classList.remove("act");
      i = e.key==="ArrowDown" ? Math.min(items.length-1,i+1) : Math.max(0,i-1);
      items[i].classList.add("act"); items[i].scrollIntoView({block:"nearest"});
    } else if(e.key==="Enter"){
      e.preventDefault(); onPick(items[Math.max(0,i)].dataset.id);
    }
  });
  box.addEventListener("click",e=>{
    const a=e.target.closest(".res"); if(!a) return;
    e.preventDefault(); onPick(a.dataset.id);
  });
  document.addEventListener("click",e=>{ if(!box.hidden && !box.contains(e.target) && e.target!==input) box.hidden=true; });
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

/* ---------- Section building blocks ---------- */
function slotsHTML(f){ return `<div class="slots">${f.map(x=>`<div class="slot"><span class="slot-l">${esc(x)}</span><span class="slot-h">Not written yet</span></div>`).join("")}</div>`; }
function tableHTML(t){
  const rows = Array.isArray(t.rows) ? t.rows.map(r=>`<tr><td class="rl">${esc(r)}</td>${t.cols.slice(1).map(()=>"<td>—</td>").join("")}</tr>`).join("")
    : Array.from({length:t.rows},()=>`<tr>${t.cols.map(()=>"<td>—</td>").join("")}</tr>`).join("");
  return `${t.title?`<p class="sub-h">${esc(t.title)}</p>`:""}<div class="tbl-wrap"><table class="tpl${t.cols.length<=3?" narrow":""}"><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function phasesHTML(s){ return `<div class="phases">${s.phases.map(p=>`<div class="phase"><h4>${esc(p)}</h4>${s.pf.map(x=>`<div class="slot"><span class="slot-l">${esc(x)}</span><span class="slot-h">Not written yet</span></div>`).join("")}</div>`).join("")}</div>`; }
function videoHTML(){ return `<div class="video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg><span>No video added yet</span></div>`; }
function chainHTML(n){ return `<div class="chain"><span class="c">Regression 2</span><span class="arr">←</span><span class="c">Regression 1</span><span class="arr">←</span><span class="c me">${esc(n.title)}</span><span class="arr">→</span><span class="c">Progression 1</span><span class="arr">→</span><span class="c">Progression 2</span></div>`; }
function stagesHTML(){ return STAGES.map((s,i)=>`<div class="stage"><h4><b>${i+1}</b>${esc(s[0])}</h4>${slotsHTML(s[1])}</div>`).join(""); }
function termsHTML(){ const keys=Object.keys(GLOSS).sort((a,b)=>a.localeCompare(b)); return `<p class="note">${keys.length} terms defined. These are shown as hover definitions throughout every article.</p><div class="tbl-wrap"><table class="tpl live"><thead><tr><th style="width:22%">Term</th><th>Definition</th></tr></thead><tbody>${keys.map(k=>`<tr><td class="rl">${esc(k)}</td><td>${esc(GLOSS[k].d)}</td></tr>`).join("")}</tbody></table></div>`; }
function refsTable(n){
  const c=CONTENT[n.id], list = c&&Array.isArray(c.refs) ? c.refs : [];
  const pend = MANIFEST[n.id] && !c;
  const body = list.length ? list.map((r,i)=>`<tr><td class="num">${i+1}</td><td>${esc(r.cite||"")}</td><td>${r.doi?esc(r.doi):"—"}</td><td>${esc(r.design||"—")}</td><td>${esc(r.level||"—")}</td><td>${esc(r.licence||"—")}</td><td>${esc(r.used||"—")}</td></tr>`).join("")
    : Array.from({length:pend?refCount(n):3},(_,i)=>`<tr><td class="num">${i+1}</td><td>${pend?"Loading…":"—"}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`).join("");
  return `<div class="tbl-wrap"><table class="tpl${list.length?" live":""}"><thead><tr><th class="num">#</th><th>Citation</th><th>DOI or link</th><th>Design</th><th>NHMRC level</th><th>Licence</th><th>Used for</th></tr></thead><tbody>${body}</tbody></table></div><p class="note">Cite facts and statistics freely. Write every sentence yourself and redraw figures from the data. <a href="#references">Reference rules</a></p>`;
}
function secHTML(n,s,i){
  const pending = MANIFEST[n.id] && !CONTENT[n.id];
  const c = CONTENT[n.id] && CONTENT[n.id].sections && CONTENT[n.id].sections[s.t];
  const filled = s.refs ? refCount(n)>0 : !!c;
  let b="";
  if(c && !s.refs) b += `<div class="prose">${c}</div>`;
  else if(!s.refs){
    if(s.f) b += slotsHTML(s.f);
    if(s.table) b += tableHTML(s.table);
    if(s.phases) b += phasesHTML(s);
    if(s.video) b += videoHTML();
    if(s.chain) b += chainHTML(n);
    if(s.stages) b += stagesHTML();
    if(s.terms) b += termsHTML();
  }
  if(s.refs) b += refsTable(n);
  if(s.calc) b += '<p class="note">Interpret results with the <a href="#tests">post-test probability calculator</a>.</p>';
  if(s.mcid) b += '<p class="note">Check a patient\'s change against the MCID with the <a href="#measures">MCID checker</a>.</p>';
  const chip = s.refs ? `<span class="chip mono">${refCount(n)}</span>` : pending ? '<span class="chip acc">Loading…</span>' : filled ? '<span class="chip acc">Written</span>' : '<span class="chip">Empty</span>';
  return `<details class="sec" id="sec-${i}"${i===0?" open":""}><summary><span class="sec-n">${i+1}</span><span class="sec-t">${esc(s.t)}</span>${chip}${SEC_CARET}</summary><div class="sec-b">${b}</div></details>`;
}

/* ---------- Children ---------- */
function kidsHTML(n){
  if(!n.kids) return "";
  const containers = n.kids.some(k=>k.kids);
  const head = `<div class="kids-h"><h2>${PLURAL[n.kids[0].type]||"Pages"}</h2><span>${plural(n.kids.length,"item")} · ${n.leafCount} pages</span></div>`;
  if(containers){
    return `<section class="kids">${head}<div class="cards">${n.kids.map(k=>{
      const names = k.kids ? k.kids.slice(0,4).map(x=>esc(x.title)).join(" · ")+(k.kids.length>4?` · +${k.kids.length-4} more`:"") : "";
      return `<a class="card" href="#${k.id}"><span class="card-t">${k.type==="domain"?domDot(k.dom):""}${esc(k.title)}</span><span class="card-m">${k.kids?k.leafCount+" pages · "+writtenIn(k)+" written":TYPE[k.type]}</span>${names?`<span class="card-l">${names}</span>`:""}</a>`;
    }).join("")}</div></section>`;
  }
  return `<section class="kids">${head}<div class="rows">${n.kids.map(k=>`<a class="row" href="#${k.id}"><span class="sdot s-${statusOf(k)}" title="${STAT[statusOf(k)]}"></span><span class="row-t">${esc(k.title)}</span>${flagChip(k)}</a>`).join("")}</div></section>`;
}

/* ---------- Aside ---------- */
function asideHTML(n,tpl){
  const toc = tpl.map((s,i)=>`<button type="button" data-act="toc" data-sec="${i}"><b>${i+1}</b><span>${esc(s.t)}</span></button>`).join("");
  let mid;
  if(n.kids){
    const w=writtenIn(n);
    mid = `<div class="acard"><h3>Coverage</h3><div class="lrow"><span>Pages</span><span>${n.leafCount}</span></div><div class="lrow"><span>Written</span><span>${w}</span></div><div class="lrow"><span>References</span><span>${refStats(n).refs}</span></div><div style="margin-top:10px">${progBar(w,n.leafCount)}</div></div>`;
  } else {
    const rows = LINKS[n.type]||["References"];
    mid = `<div class="acard"><h3>Linked content</h3>${rows.map(r=>`<div class="lrow"><span>${esc(r)}</span><span>${r==="References"?refCount(n):0}</span></div>`).join("")}</div>`;
  }
  const mine = cards.filter(c=>c.ctx===n.id).length;
  const e=evidence(n);
  let evCard="";
  if(e){
    const frac = e.monthsLeft===null?0:Math.max(0,Math.min(1,1-(e.monthsLeft/REVIEW_MONTHS)));
    const barCls = e.state==="overdue"?"over":e.state==="due"?"due":"";
    evCard = `<div class="acard"><h3>Evidence currency</h3><div class="ev">
      <div class="ev-row"><span>References</span><span>${e.refs}</span></div>
      <div class="ev-row"><span>Newest source</span><span>${e.src||"—"}</span></div>
      <div class="ev-row"><span>Last reviewed</span><span>${e.on?fmtDate(e.on):"never"}</span></div>
      <div class="ev-row"><span>Review due</span><span>${e.due?fmtDate(e.due):"—"}</span></div>
      <div class="ev-bar ${barCls}"><span style="width:${Math.round(frac*100)}%"></span></div>
      ${e.stale?`<p class="note" style="color:var(--amber);font-weight:700">Newest source is ${e.srcAge} years old — check for newer evidence.</p>`:""}
      ${!e.on?`<p class="note">Set <span style="font-family:var(--f-mono)">reviewed</span> in content/index.json once you have checked this page against its sources.</p>`:""}
    </div></div>`;
  }
  return `<aside class="page-aside"><div class="acard toc-card"><h3>On this page</h3><div class="toc">${toc}</div></div>${mid}${evCard}<div class="acard"><h3>Anki</h3><p class="note">${plural(mine,"card")} drafted for this page.</p><button class="btn sm" type="button" data-act="anki" data-id="${n.id}">Make cards for this page</button></div></aside>`;
}

/* ---------- Pages ---------- */
function crumbsHTML(n){
  const a = ancestors(n);
  const parts = (a.length ? a : [BY.get("home")]).map(x=>`<a href="#${x.id}">${esc(labelOf(x))}</a><span aria-hidden="true">›</span>`).join("");
  return `<nav class="crumbs" aria-label="Breadcrumb">${parts}<span>${esc(labelOf(n))}</span></nav>`;
}
function pageHTML(n){
  const tpl = tplFor(n);
  const eyebrow = `${domDot(n.dom)}${esc(TYPE[n.type]||"Page")}${n.dom&&n.type!=="domain"?" · "+esc(DOM[n.dom].name):""}`;

/* ============================================================
   VIDEO SLOTS
   Every presentation and special test gets a video spot.
   To fill one, add its page id and a YouTube id to VIDEOS:
       "msk-knee-patellofemoral-pain": {y:"dQw4w9WgXcQ", t:"Optional caption"}
   Use the 11-character id from the URL, not the whole URL.
   Nothing is embedded until you add an entry, so no page
   loads a YouTube frame it does not need.
   ============================================================ */
const VIDEOS = {};

function videoHTML(n){
  /* only conditions and special tests carry a video slot */
  const kind = n.type;
  if(n.kids) return "";
  if(kind !== "presentation" && kind !== "test") return "";
  const v = VIDEOS[n.id];
  const label = kind === "test" ? "Technique demonstration" : "Video overview";
  if(v && v.y){
    const t = v.t ? `<p class="vid-cap">${esc(v.t)}</p>` : "";
    return `<section class="vid-wrap">
      <div class="vid-h"><h2>${label}</h2><span class="chip mono">Embedded</span></div>
      <div class="vid-frame">
        <iframe src="https://www.youtube-nocookie.com/embed/${esc(v.y)}?rel=0"
          title="${esc(n.title)} — ${label.toLowerCase()}" loading="lazy"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>${t}
    </section>`;
  }
  return `<section class="vid-wrap">
    <div class="vid-h"><h2>${label}</h2><span class="chip mono">Slot empty</span></div>
    <div class="vid-empty">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2.5" y="5" width="19" height="14" rx="3.5"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/>
      </svg>
      <b>No video yet</b>
      <p>Add <code>"${esc(n.id)}"</code> to <code>VIDEOS</code> with a YouTube id to fill this slot.</p>
    </div>
  </section>`;
}

  const chips = [statusChip(n), flagChip(n), evChip(n), `<span class="chip mono">${plural(tpl.length,"section")}</span>`, n.kids?`<span class="chip mono">${n.leafCount} pages</span>`:"", `<span class="chip mono">${plural(refCount(n),"reference")}</span>`].join("");
  const tool = n.tool ? toolHTML(n.tool) : "";
  return `<div class="page"><div class="page-main">
    ${crumbsHTML(n)}
    <div class="eyebrow">${eyebrow}</div>
    <h1 class="pt">${esc(n.title)}</h1>
    <div class="meta">${chips}</div>
    <div class="actions"><button class="btn pri" type="button" data-act="anki" data-id="${n.id}">Make Anki cards</button><button class="btn" type="button" data-act="expand">Expand all sections</button><button class="btn" type="button" data-act="collapse">Collapse all</button></div>
    ${tool}
    ${kidsHTML(n)}
    ${videoHTML(n)}
    <div class="secs-h"><h2>${n.kids?"Page template":"Article template"}</h2><span>${esc(TPL_NAME[tplKey(n)]||"Library page")}</span></div>
    <div class="secs">${tpl.map((s,i)=>secHTML(n,s,i)).join("")}</div>
    <p class="foot">Page id <span style="font-family:var(--f-mono)">${esc(n.id)}</span> · status and text are set in the page source.</p>
  </div>${asideHTML(n,tpl)}</div>`;
}

/* ---------- Home ---------- */
function homeHTML(){
  const count = t=>PAGES.filter(n=>n.type===t).length;
  const written = PAGES.filter(n=>!n.kids && statusOf(n)!=="empty").length;
  const leaves = PAGES.filter(n=>!n.kids).length;
  const stats = [
    [count("presentation"),"Presentations"],[count("test"),"Special tests"],[count("measure"),"Outcome measures"],[count("exercise"),"Exercises"],
    [count("topic")+count("technique")+count("glossary"),"Topics & techniques"],[count("case")+count("station")+count("bank"),"Banks, cases & stations"],
    [PAGES.length,"Pages in total"],[written,"Pages written"]
  ];
  const knee = BY.get("msk-knee");
  const firstEight = ["^ACL reconstruction","Patellofemoral pain","Meniscal injury","Patellar tendinopathy","MCL injury","ITB-related lateral knee pain","Knee osteoarthritis","!Septic arthritis"].map(s=>s.replace(/^[!^]/,"")).map(t=>knee.kids.find(k=>k.title===t)).filter(Boolean);
  const domRows = BY.get("conditions").kids.map(d=>{ const w=writtenIn(d); return `<tr><td><span class="cell-dom">${domDot(d.dom)}<a href="#${d.id}">${esc(d.title)}</a></span></td><td class="num">${d.kids.length}</td><td class="num">${d.leafCount}</td><td class="num">${w}</td><td style="min-width:120px">${progBar(w,d.leafCount)}</td></tr>`; }).join("");
  const libRows = TABS.filter(t=>t.kids && t.id!=="conditions").map(t=>{ const w=writtenIn(t); return `<tr><td><span class="cell-dom"><a href="#${t.id}">${esc(t.title)}</a></span></td><td class="num">${t.kids.length}</td><td class="num">${t.leafCount}</td><td class="num">${w}</td><td style="min-width:120px">${progBar(w,t.leafCount)}</td></tr>`; }).join("");
  const usage = {}; PAGES.forEach(n=>{ const k=tplKey(n); usage[k]=(usage[k]||0)+1; });
  const tplRows = Object.keys(TPL_NAME).map(k=>`<tr><td class="rl">${esc(TPL_NAME[k])}</td><td class="num">${TPL[k].length}</td><td class="num">${usage[k]||0}</td></tr>`).join("");
  return `
  <section class="hero">
    <div class="eyebrow">Study library · template build</div>
    <h1>CliniPD</h1>
    <p class="tagline">Clinical Physio Development</p>
    <p class="lede">A linked clinical reference for physiotherapy — every presentation, special test, outcome measure and exercise, written to one template, carrying its own references and its own Anki deck.</p>
    <div class="actions"><a class="btn pri" href="#msk-knee">Start with the knee</a><a class="btn" href="#conditions">Browse conditions</a><a class="btn" href="#anki">Open the Anki builder</a></div>
  </section>
  <div class="stats">${stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>

  <section class="block">
    <div class="start">
      <div class="eyebrow">${domDot("msk")}Build order</div>
      <h3>Write these eight knee pages first</h3>
      <p class="note">Finish them to the full template, give them to your cohort, and decide on the rest after that.</p>
      <ol>${firstEight.map(k=>`<li><a href="#${k.id}">${esc(k.title)}</a></li>`).join("")}</ol>
    </div>
  </section>

  <section class="block">
    <h2>How pages link</h2>
    <div class="flow"><span class="chip acc">Presentation</span><span class="sep">↔</span><span class="chip">Special tests</span><span class="sep">↔</span><span class="chip">Outcome measures</span><span class="sep">↔</span><span class="chip">Exercises</span><span class="sep">↔</span><span class="chip">Questions, cases & OSCE</span><span class="sep">→</span><span class="chip">Anki deck</span></div>
    <p class="note">Every page, including each body region and domain, has its own References section.</p>
  </section>

  <section class="block">
    <h2>Build progress</h2>
    <div class="two">
      <div class="tbl-wrap"><table class="tpl live"><thead><tr><th>Conditions</th><th class="num">Sections</th><th class="num">Pages</th><th class="num">Written</th><th>Progress</th></tr></thead><tbody>${domRows}</tbody></table></div>
      <div class="tbl-wrap"><table class="tpl live"><thead><tr><th>Libraries</th><th class="num">Sections</th><th class="num">Pages</th><th class="num">Written</th><th>Progress</th></tr></thead><tbody>${libRows}</tbody></table></div>
    </div>
    <p class="note">${written} of ${leaves} pages written.</p>
  </section>

  <section class="block two">
    <div style="display:grid;gap:12px;align-content:start">
      <h2 style="font-size:21px">Page templates</h2>
      <div class="tbl-wrap"><table class="tpl live narrow"><thead><tr><th>Template</th><th class="num">Sections</th><th class="num">Pages</th></tr></thead><tbody>${tplRows}</tbody></table></div>
    </div>
    <div style="display:grid;gap:12px;align-content:start">
      <h2 style="font-size:21px">Page status</h2>
      <div class="legend">${Object.keys(STAT).map((s,i)=>`<span><span class="sdot s-${s}"></span>${STAT[s]}</span>${i<4?'<span aria-hidden="true" style="color:var(--faint)">→</span>':""}`).join("")}</div>
      <div class="legend"><span><span class="t-flag">!</span>Must-not-miss pathology</span><span><span class="chip amber">Post-op</span>Post-operative pathway</span></div>
    </div>
  </section>`;
}

/* ---------- References tab ---------- */
function refsHTML(){
  const rows = BY.get("conditions").kids.concat(TABS.filter(t=>t.kids && t.id!=="conditions")).map(n=>{ const r=refStats(n); return `<tr><td><span class="cell-dom">${n.type==="domain"?domDot(n.dom):""}<a href="#${n.id}">${esc(n.title)}</a></span></td><td class="num">${r.pages}</td><td class="num">${r.withRefs}</td><td class="num">${r.refs}</td><td style="min-width:120px">${progBar(r.withRefs,r.pages)}</td></tr>`; }).join("");
  return `${crumbsHTML(BY.get("references"))}
  <div class="eyebrow">Library</div>
  <h1 class="pt">References</h1>
  <p class="lede-s">Every page carries its own reference list. This page tracks coverage and sets the rules for what can be reused.</p>
  <section class="block"><h2>Reference coverage</h2>
    <div class="tbl-wrap"><table class="tpl live"><thead><tr><th>Section</th><th class="num">Pages</th><th class="num">With references</th><th class="num">References</th><th>Coverage</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>
  <section class="block"><h2>Evidence currency</h2>
    <p>Every written page is checked against its sources on a ${REVIEW_MONTHS}-month cycle. A source older than ${SOURCE_STALE_YEARS} years is flagged for a fresh literature check.</p>
    ${(()=>{ const w=PAGES.filter(x=>refCount(x)>0); if(!w.length) return '<div class="empty">No pages have references yet.</div>';
      return `<div class="tbl-wrap"><table class="tpl live"><thead><tr><th>Page</th><th class="num">Refs</th><th class="num">Newest source</th><th>Last reviewed</th><th>Review due</th><th>Status</th></tr></thead><tbody>${
      w.map(x=>{ const e=evidence(x); const cls=e.state==="overdue"?"red":e.state==="due"?"amber":e.state==="current"?"ok":"";
      const lbl=e.state==="overdue"?"Overdue":e.state==="due"?"Due soon":e.state==="current"?"Current":"Not reviewed";
      return `<tr><td><span class="cell-dom"><a href="#${x.id}">${esc(x.title)}</a></span></td><td class="num">${e.refs}</td><td class="num">${e.src||"—"}${e.stale?' <span class="chip amber">old</span>':""}</td><td>${e.on?fmtDate(e.on):"—"}</td><td>${e.due?fmtDate(e.due):"—"}</td><td><span class="chip ${cls}">${lbl}</span></td></tr>`;}).join("")}</tbody></table></div>`;})()}
  </section>
  <section class="block"><h2>Reference record</h2>
    <p>Each reference on a page stores the same fields.</p>
    ${slotsHTML(["Citation","DOI or link","Study design","NHMRC level","Licence","Used for (section)"])}
  </section>
  <section class="block two">
    <div style="display:grid;gap:12px;align-content:start"><h2 style="font-size:21px">NHMRC levels of evidence</h2>
      <div class="tbl-wrap"><table class="tpl live narrow"><thead><tr><th>Level</th><th>Intervention study design</th></tr></thead><tbody>${NHMRC.map(r=>`<tr><td class="rl" style="font-family:var(--f-mono)">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>
    </div>
    <div style="display:grid;gap:12px;align-content:start"><h2 style="font-size:21px">What you can reuse</h2>
      <div class="tbl-wrap"><table class="tpl live"><thead><tr><th>Source</th><th>Text</th><th>Figures</th><th>Commercial use</th></tr></thead><tbody>${LICENCES.map(r=>`<tr><td class="rl">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">A citation stops plagiarism. It does not give permission to copy wording, tables or figures.</p>
    </div>
  </section>`;
}

/* ---------- Tools ---------- */
function toolHTML(kind){
  if(kind==="posttest") return `<section class="tool" id="tool-pt">
    <div class="tool-h"><h2>Post-test probability calculator</h2><span class="ex-note">Example values · replace with your own</span></div>
    <div class="seg" role="radiogroup" aria-label="Input type"><label><input type="radio" name="ptm" value="snsp" checked><span>Sensitivity and specificity</span></label><label><input type="radio" name="ptm" value="lr"><span>Likelihood ratios</span></label></div>
    <div class="fgrid">
      <div class="field"><label for="pt-pre">Pre-test probability (%)</label><input id="pt-pre" type="number" min="0" max="100" step="1" value="30" inputmode="decimal"></div>
      <div class="field" data-m="snsp"><label for="pt-sn">Sensitivity (%)</label><input id="pt-sn" type="number" min="0" max="100" step="1" value="85" inputmode="decimal"></div>
      <div class="field" data-m="snsp"><label for="pt-sp">Specificity (%)</label><input id="pt-sp" type="number" min="0" max="100" step="1" value="90" inputmode="decimal"></div>
      <div class="field" data-m="lr" hidden><label for="pt-lrp">LR+</label><input id="pt-lrp" type="number" min="0" step="0.1" value="8.5" inputmode="decimal"></div>
      <div class="field" data-m="lr" hidden><label for="pt-lrn">LR−</label><input id="pt-lrn" type="number" min="0" step="0.01" value="0.17" inputmode="decimal"></div>
    </div>
