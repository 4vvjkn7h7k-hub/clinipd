<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CliniPD — Clinical Physio Development. A linked physiotherapy reference and study library: conditions, special tests, outcome measures, exercises and Anki card export.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Physio Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: app shell — sticky header with library tabs, collapsible tree on the left (drawer on phones), reading column with a sticky page rail on wide screens. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#EAF0F2; --ink:#14212B; --muted:#53636E; --faint:#7F8F9B; --line:#D7DFE4; --line-2:#BFCAD2;
  --accent:#0A6A94; --accent-ink:#FFFFFF; --accent-soft:#DCEEF6;
  --red:#B3261E; --red-soft:#FBE7E4; --amber:#8A5A00; --amber-soft:#F6ECD8; --ok:#2E7346; --ok-soft:#E1F0E5;
  --scrim:rgb(10 20 28 / .45);
  --d-msk:#A04A2A; --d-neuro:#9C7400; --d-cardio:#B42340; --d-geri:#4D6479; --d-sports:#0B7C83; --d-paeds:#3F7A2C; --d-pelvic:#83407F; --d-pain:#4B50A8;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --side-w:290px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --surface:#152028; --surface-2:#1B2933; --ink:#E5ECF0; --muted:#A2B2BC; --faint:#7D909C; --line:#283843; --line-2:#3A4D5A;
    --accent:#5BB6E2; --accent-ink:#06131B; --accent-soft:#14324A;
    --red:#FF8A7E; --red-soft:#3D1D1B; --amber:#E8B25A; --amber-soft:#3A2E17; --ok:#6FCB8F; --ok-soft:#173323;
    --scrim:rgb(0 0 0 / .55);
    --d-msk:#E08A68; --d-neuro:#E0B643; --d-cardio:#F07A8E; --d-geri:#96AEC4; --d-sports:#4FC3C9; --d-paeds:#86C26F; --d-pelvic:#D08ACB; --d-pain:#9EA3EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#152028; --surface-2:#1B2933; --ink:#E5ECF0; --muted:#A2B2BC; --faint:#7D909C; --line:#283843; --line-2:#3A4D5A;
  --accent:#5BB6E2; --accent-ink:#06131B; --accent-soft:#14324A;
  --red:#FF8A7E; --red-soft:#3D1D1B; --amber:#E8B25A; --amber-soft:#3A2E17; --ok:#6FCB8F; --ok-soft:#173323;
  --scrim:rgb(0 0 0 / .55);
  --d-msk:#E08A68; --d-neuro:#E0B643; --d-cardio:#F07A8E; --d-geri:#96AEC4; --d-sports:#4FC3C9; --d-paeds:#86C26F; --d-pelvic:#D08ACB; --d-pain:#9EA3EE;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-0.01em;font-weight:600}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;min-height:58px;max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:22px;height:22px;fill:var(--accent);flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-0.015em}
.search{position:relative;flex:1;min-width:0;max-width:560px;margin-left:auto}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;max-height:min(60vh,460px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgb(0 0 0 / .16)}
.res{display:grid;gap:1px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink);cursor:pointer}
.res:hover,.res.act{background:var(--accent-soft)}
.res-t{font-weight:700;font-size:14px}
.res-p{font-size:12px;color:var(--muted)}
.res-empty{padding:10px;color:var(--muted);font-size:13.5px}
.browse{display:none;flex:none;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.browse svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.tabs-band{border-top:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:1480px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:11px 11px 10px;font-weight:700;font-size:13.5px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:500 11px var(--f-mono);color:var(--faint)}

/* Shell */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:34px;max-width:1480px;margin:0 auto;padding-block:24px 72px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,104px) + 16px);align-self:start;max-height:calc(100vh - var(--top-h,104px) - 32px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;padding-right:6px}
.side-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.side-h a,.side-h b{font-family:var(--f-display);font-weight:600;font-size:16.5px;color:var(--ink);text-decoration:none}
.side-h span{font:500 11.5px var(--f-mono);color:var(--faint);white-space:nowrap}
.side-tools{display:flex;justify-content:flex-end;padding:0 4px 6px}
.side-tools button{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:5px}
.side-tools button:hover{color:var(--accent)}
.btn.side-x{display:none}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.t-row{display:flex;align-items:center;gap:4px;padding:2px 6px 2px calc(var(--lvl,0) * 14px + 2px);border-radius:6px;min-height:31px}
.t-row:hover{background:var(--surface-2)}
.t-row.on{background:var(--accent-soft)}
.t-row.on .t-link{font-weight:700}
.t-car{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--faint);padding:0}
.t-car:hover{color:var(--ink);background:var(--line)}
.t-car svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s}
.t-car[aria-expanded="true"] svg{transform:rotate(90deg)}
.t-sp{flex:none;width:22px}
.t-link{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3;padding:4px 0;overflow-wrap:anywhere}
.t-n{font:11px var(--f-mono);color:var(--faint);flex:none}
.t-flag{font:700 11.5px var(--f-mono);color:var(--red);flex:none;width:10px;text-align:center}
.sdot{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent}
.sdot.s-outline{border-color:var(--amber);background:var(--amber-soft)}
.sdot.s-draft{border-color:var(--accent);background:var(--accent-soft)}
.sdot.s-reviewed{border-color:var(--ok);background:var(--ok-soft)}
.sdot.s-published{border-color:var(--ok);background:var(--ok)}
.ddot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--dc,var(--faint))}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35}

/* Page */
.page{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:32px;align-items:start}
.page-main{min-width:0}
.page-aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,104px) + 16px);display:grid;gap:12px;max-height:calc(100vh - var(--top-h,104px) - 32px);overflow:auto}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:13px;color:var(--faint);margin-bottom:14px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent);text-decoration:underline}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--muted)}
h1.pt{font-size:clamp(26px,3.2vw,35px);line-height:1.15;margin:8px 0 12px}
.lede-s{font-size:16px;color:var(--muted);max-width:64ch;margin:-2px 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap;flex:none}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mono{font-family:var(--f-mono);font-weight:500;font-size:11.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* Children */
.kids{margin:0 0 30px}
.kids-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.kids-h h2{font-size:20px}
.kids-h span{font:12px var(--f-mono);color:var(--faint)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:grid;gap:7px;align-content:start;padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card-t{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.25}
.card-m{font:12px var(--f-mono);color:var(--faint)}
.card-l{font-size:13px;color:var(--muted);line-height:1.45}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));column-gap:22px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.row:hover .row-t{color:var(--accent)}
.row-t{flex:1;min-width:0;font-size:14.5px;line-height:1.35}

/* Sections */
.secs-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.secs-h h2{font-size:20px}
.secs-h span{font:12px var(--f-mono);color:var(--faint)}
.secs{display:grid;gap:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;scroll-margin-top:calc(var(--top-h,104px) + env(safe-area-inset-top,0px) + 14px)}
.sec>summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none;border-radius:10px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover .sec-t{color:var(--accent)}
.sec-n{font:500 12px var(--f-mono);color:var(--faint);width:20px;flex:none;text-align:right}
.sec-t{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.3}
.sec-car{width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:2.4;flex:none;transition:transform .15s}
.sec[open] .sec-car{transform:rotate(90deg)}
.sec-b{padding:4px 16px 18px 48px;display:grid;gap:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.slot{border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.slot-l{font-weight:700;font-size:13.5px;line-height:1.35}
.slot-h{font-size:12.5px;color:var(--faint)}
.sub-h{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tpl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.tpl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tpl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--faint);vertical-align:top}
table.tpl tr:last-child td{border-bottom:0}
table.tpl td.rl{color:var(--ink);font-weight:700}
table.tpl td.num,table.tpl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.tpl.live td{color:var(--ink)}
table.tpl.narrow{min-width:420px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.phase{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;background:var(--bg)}
.phase h4{font-family:var(--f-body);font-size:13.5px;font-weight:700}
.phase .slot{background:var(--surface)}
.video{aspect-ratio:16/9;max-width:min(100%,560px);border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--faint);font-size:13px;background:var(--surface-2)}
.video svg{width:28px;height:28px;stroke:var(--faint);fill:none;stroke-width:1.8}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain .c{border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--faint)}
.chain .c.me{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.chain .arr{color:var(--faint);font-family:var(--f-mono)}
.stage{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:grid;gap:8px}
.stage h4{font-family:var(--f-body);font-size:14px;font-weight:700}
.stage h4 b{font:500 12px var(--f-mono);color:var(--faint);margin-right:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.prose{font-size:15px;line-height:1.65;max-width:68ch;min-width:0}
.sec-b>*{min-width:0}
.prose .tbl-wrap,.prose .phases,.prose ul,.prose ol{max-width:100%}
.prose ul,.prose ol{padding-left:22px;margin:0;display:grid;gap:4px}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.ev{display:grid;gap:7px}
.ev-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:baseline}
.ev-row span:last-child{font-family:var(--f-mono);font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.ev-bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.ev-bar.due span{background:var(--amber)} .ev-bar.over span{background:var(--red)}
.gl{border-bottom:1px dashed var(--accent);cursor:help;color:inherit}
.gl:hover,.gl:focus-visible{background:var(--accent-soft);border-bottom-style:solid}
.gpop{position:absolute;z-index:70;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgb(0 0 0 / .18);font-size:13.5px;line-height:1.5}
.gpop b{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.gpop a{font-size:12.5px;font-weight:700;display:inline-block;margin-top:8px}
.prose>.tbl-wrap,.prose>.phases{margin:12px 0}

/* Aside */
.acard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.acard h3{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.075em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.toc{display:grid;gap:1px}
.toc button{display:flex;gap:8px;text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px;font-size:13px;line-height:1.35;color:var(--ink);cursor:pointer}
.toc button b{font:500 11px var(--f-mono);color:var(--faint);width:16px;flex:none;text-align:right;padding-top:1px}
.toc button:hover{background:var(--surface-2);color:var(--accent)}
.lrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lrow:last-child{border-bottom:0}
.lrow span:last-child{font:12.5px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:99px}
.acard .btn{margin-top:10px;width:100%}

/* Home */
.hero{padding:4px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px;display:grid;gap:12px}
.hero h1{font-size:clamp(32px,4.6vw,48px);line-height:1.05;letter-spacing:-0.02em}
.lede{font-size:17px;color:var(--muted);max-width:62ch}
.hero .actions{margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:34px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:2px}
.stat b{font:500 26px/1.15 var(--f-mono);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.block{margin-bottom:36px;display:grid;gap:12px}
.block>h2{font-size:21px}
.block>p{color:var(--muted);max-width:68ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:22px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .sep{color:var(--faint);font-family:var(--f-mono);font-size:13px}

const CONTENT = {"msk-knee-patellofemoral-pain": {"sections": {"Overview": "\n<p><b>Patellofemoral pain (PFP)</b> is pain around or behind the patella, aggravated by at least one weight-bearing activity that loads the patellofemoral joint (PFJ) on a flexed knee — squatting, stair ambulation, running, hopping or jumping (2016 Manchester consensus).</p>\n<p><b>Supporting but non-essential features:</b> crepitus, patellar facet tenderness, small effusion, and pain on prolonged sitting or on rising from sitting.</p>\n<p><b>Exclusion:</b> a history of patellar dislocation or subluxation places the patient outside the PFP definition — that is patellar instability, a separate presentation.</p>\n<p><b>Terminology to avoid:</b> \"patellofemoral pain <i>syndrome</i>\" is discouraged by consensus. \"Chondromalacia patellae\" is an imaging or arthroscopic cartilage finding, not a synonym. \"Maltracking\" describes a mechanism, not a diagnosis.</p>\n<p><b>Three-point summary</b></p>\n<ul>\n<li>A clinical diagnosis of pattern plus exclusion — there is no definitive confirmatory test.</li>\n<li>Combined hip and knee exercise is the best-supported intervention; wait-and-see is the worst option.</li>\n<li>It is not self-limiting: 57% report unfavourable recovery at 5–8 years.</li>\n</ul>", "Epidemiology & risk factors": "\n<p><b>Prevalence and incidence</b></p>\n<ul>\n<li>Adolescents: prevalence <b>7–28%</b>, incidence <b>9.2%</b> (2016 consensus).</li>\n<li>Approximately <b>1 in 14 adolescents</b> and up to <b>1 in 5 adults</b> in selected populations at any one time (IASP).</li>\n<li>Military recruits: annual incidence <b>3.8% (men)</b> and <b>6.5% (women)</b>; prevalence <b>12% (men)</b> and <b>15% (women)</b>.</li>\n<li>Most common in physically active populations — runners, military recruits, jumping and court athletes.</li>\n</ul>\n<p><b>Risk factors</b></p>\n<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Factor</th><th>Evidence</th></tr></thead><tbody><tr><td class=\"rl\">Single-sport specialisation</td><td>RR <b>1.5</b> (95% CI 1.0–2.2) vs multisport athletes</td></tr><tr><td class=\"rl\">Training error / rapid load increase</td><td>Proposed; limited high-quality evidence</td></tr><tr><td class=\"rl\">Altered hip and knee kinematics</td><td>Proposed; limited high-quality evidence</td></tr><tr><td class=\"rl\">Muscle strength</td><td><b>Conflicting</b> evidence as a prospective risk factor</td></tr><tr><td class=\"rl\">BMI or body fat %</td><td><b>Not</b> a risk factor (moderate–strong evidence)</td></tr><tr><td class=\"rl\">Age</td><td><b>Not</b> a risk factor (moderate–strong evidence)</td></tr><tr><td class=\"rl\">Height, weight or limb length</td><td><b>Not</b> a risk factor (moderate–strong evidence)</td></tr></tbody></table></div>\n<p class=\"note\">Note the direction of travel: several factors long taught as causal have been excluded prospectively. Aetiology is considered multifactorial and remains poorly understood.</p>", "Pathoanatomy & mechanism": "\n<p><b>Structures involved.</b> Articular cartilage is aneural and cannot itself be the pain source. Candidate nociceptive tissues are the richly innervated <b>subchondral bone</b>, <b>infrapatellar fat pad</b>, <b>retinaculum</b>, <b>synovium</b> and <b>peripatellar soft tissue</b>.</p>\n<p><b>Working mechanism.</b> Elevated or poorly distributed PFJ stress, where stress = joint reaction force ÷ contact area. PFJ reaction force rises steeply with knee flexion angle under load, which is why squatting, stairs and prolonged sitting provoke symptoms.</p>\n<p><b>The common thread is load exceeding tissue capacity</b> — a change in training volume, intensity, surface or footwear, or a return to activity after a break.</p>\n<p><b>What has weakened.</b> The structural \"maltracking\" model is no longer sufficient on its own. Imaging findings correlate poorly with symptoms, and many asymptomatic people show the same features.</p>\n<p><b>Psychosocial contribution.</b> Psychological factors are associated with symptom severity and predict clinical outcome. A biopsychosocial framing is now recommended rather than a purely mechanical one.</p>", "Clinical presentation": "\n<p><b>Area and nature.</b> Diffuse, dull, aching retropatellar or peripatellar pain that the patient struggles to localise — often indicated with a whole-hand grasp over the kneecap rather than a fingertip. Frequently bilateral.</p>\n<p><b>Aggravating factors</b> (at least one weight-bearing, loaded-flexion activity is required for the diagnosis):</p>\n<ul>\n<li>Squatting and deep knee flexion</li>\n<li>Stair ambulation — descent is typically worse than ascent</li>\n<li>Running, particularly downhill</li>\n<li>Hopping and jumping</li>\n<li>Prolonged sitting with the knee flexed, and rising from sitting (the \"theatre sign\")</li>\n</ul>\n<p><b>Easing factors.</b> Rest, extension, reduced loaded flexion.</p>\n<p><b>24-hour pattern.</b> Typically activity-dependent rather than a morning or night pattern. <b>Constant or night pain is not typical of PFP</b> and should prompt screening for bone stress injury, infection or malignancy.</p>\n<p><b>Onset.</b> Usually insidious, often traceable to a change in training load. An acute traumatic onset points elsewhere.</p>\n<p><b>Other features.</b> Crepitus, a small effusion, and a sense of the knee \"giving way\" — which is pain inhibition or quadriceps avoidance, not true mechanical instability.</p>\n<p><b>Irritability (SIN).</b> Usually low to moderate: pain comes on at a reasonably predictable point in the aggravating activity and settles within minutes to hours of stopping. High irritability or rapidly escalating pain warrants reconsidering the diagnosis.</p>", "Differential diagnosis": "<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Condition</th><th>Distinguishing features</th><th>Must not miss</th><th>Page link</th></tr></thead><tbody><tr><td class=\"rl\">Patellar tendinopathy</td><td>Focal point tenderness at the inferior patellar pole; pain with energy-storage loading (jumping, decelerating); localises with one finger</td><td>—</td><td>Patellar tendinopathy</td></tr><tr><td class=\"rl\">Fat pad impingement (Hoffa)</td><td>Infrapatellar pain, worse into <b>extension</b> and hyperextension rather than flexion; fat pad tender and sometimes swollen</td><td>—</td><td>—</td></tr><tr><td class=\"rl\">Patellar instability / subluxation</td><td>History of dislocation or giving way with a lateral shift; positive apprehension. <b>By definition excludes PFP</b></td><td>—</td><td>Patellar instability</td></tr><tr><td class=\"rl\">Meniscal injury</td><td>Joint line tenderness, true mechanical locking or catching, twisting mechanism</td><td>—</td><td>Meniscal injury</td></tr><tr><td class=\"rl\">ITB-related lateral knee pain</td><td>Lateral joint-line-adjacent pain near 30° flexion; running-related</td><td>—</td><td>ITB-related lateral knee pain</td></tr><tr><td class=\"rl\">Osteochondral lesion</td><td>Recurrent effusion, locking, a history of impact</td><td>—</td><td>Osteochondral lesions</td></tr><tr><td class=\"rl\">Early patellofemoral OA</td><td>Older patient, prolonged morning stiffness, crepitus with radiographic change</td><td>—</td><td>Knee osteoarthritis</td></tr><tr><td class=\"rl\">Referred hip or lumbar pain</td><td>Knee examination unremarkable; symptoms reproduced on hip or lumbar testing</td><td>—</td><td>Hip osteoarthritis</td></tr><tr><td class=\"rl\"><b>SUFE or Perthes disease</b></td><td>Adolescent; <b>knee pain is a classic presentation of hip pathology</b>; restricted hip IR, antalgic gait</td><td><b>Yes</b></td><td>Slipped capital femoral epiphysis</td></tr><tr><td class=\"rl\"><b>Bone stress injury (patella or distal femur)</b></td><td>Focal bony tenderness, night pain, rapid load increase, relevant RED-S or energy-availability history</td><td><b>Yes</b></td><td>Tibial bone stress injury</td></tr><tr><td class=\"rl\"><b>Septic arthritis</b></td><td>Hot, swollen, exquisitely painful knee; systemically unwell; fever</td><td><b>Yes</b></td><td>Septic arthritis</td></tr><tr><td class=\"rl\"><b>Bone tumour</b></td><td>Constant unremitting pain, night pain, systemic features, palpable mass</td><td><b>Yes</b></td><td>Bone tumour around the knee</td></tr></tbody></table></div>\n<p><b>Red flags for this presentation</b></p>\n<ul>\n<li><b>Any adolescent with knee pain — examine the hip.</b> Missing a SUFE is the single highest-consequence error in this presentation.</li>\n<li>Constant, unremitting or night pain</li>\n<li>Fever, systemic illness, hot swollen joint</li>\n<li>Focal bony tenderness with a load-change or low-energy-availability history</li>\n<li>True locking or a large or rapidly recurring effusion</li>\n<li>Unexplained weight loss, a history of malignancy, or a palpable mass</li>\n</ul>", "Subjective examination": "<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Question</th><th>What it tells you</th><th>Shifts probability toward</th></tr></thead><tbody><tr><td class=\"rl\">\"Point to where it hurts with one finger.\"</td><td>Diffuse whole-hand grasp vs a single point</td><td>Diffuse → PFP; inferior pole point → patellar tendinopathy</td></tr><tr><td class=\"rl\">\"Stairs — is up or down worse?\"</td><td>PFJ loading in flexion under eccentric control</td><td>Descent worse → PFP</td></tr><tr><td class=\"rl\">\"What happens after an hour in the car or at the cinema?\"</td><td>The theatre sign</td><td>Positive → PFP</td></tr><tr><td class=\"rl\">\"What changed in the last 4–8 weeks?\"</td><td>Training load, surface, footwear, return from a break</td><td>A clear load change supports PFP</td></tr><tr><td class=\"rl\">\"Has the knee ever given way or shifted sideways?\"</td><td>Distinguishes pain inhibition from true instability</td><td>A lateral shift or dislocation → patellar instability, <b>not</b> PFP</td></tr><tr><td class=\"rl\">\"Does it hurt at night or at rest?\"</td><td>Screens non-mechanical pathology</td><td>Yes → bone stress injury, infection, tumour</td></tr><tr><td class=\"rl\">\"Any hip or groin pain, or a limp?\" (adolescent)</td><td>Screens SUFE / Perthes</td><td>Yes → urgent hip assessment and imaging</td></tr></tbody></table></div>\n<p><b>Patient goals and expectations.</b> Record the specific activity the patient wants back and the timeframe they expect. Expectation of recovery is itself prognostic.</p>\n<p><b>Psychosocial screen.</b> Screen for kinesiophobia, catastrophising and low self-efficacy — these are associated with severity and predict outcome. Consider the TSK, PCS or PSEQ where indicated.</p>\n<p><b>Pain intensity is prognostic — record it.</b> Usual pain >35/100 and worst pain >60/100 on VAS predicted unfavourable outcome at 12 months (Collins et al. 2013).</p>", "Objective examination": "\n<p><b>The key point:</b> the 2016 consensus states plainly that <b>\"there is no definitive clinical test to diagnose PFP.\"</b> The diagnosis is made on the symptom pattern with alternatives excluded.</p>\n<p><b>Observation.</b> Standing alignment, quadriceps bulk and VMO appearance, swelling, foot posture. Treat observed \"maltracking\" as a hypothesis, not a finding.</p>\n<p><b>Range of motion.</b> Usually full. The 2016 consensus notes ROM and effusion have <b>limited diagnostic usefulness</b> for PFP.</p>\n<p><b>Strength testing.</b> Quadriceps, hip abductors and hip external rotators — for treatment planning and baseline measurement, not for diagnosis. Hand-held dynamometry where available; otherwise single-leg heel raise, single-leg sit-to-stand and a timed side plank.</p>\n<p><b>Functional tests.</b> Double-leg squat, single-leg squat, step-down, and the activity the patient reports as aggravating. Reproduction of the concordant pain is the finding that matters.</p>\n<p><b>Neurological screen and adjacent joints.</b> Clear the hip and lumbar spine in every patient, and <b>always in an adolescent</b>.</p>\n<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Test</th><th>Accuracy</th><th>Source</th></tr></thead><tbody><tr><td class=\"rl\"><b>Pain during squatting</b> — best available test</td><td>PFP present in ~<b>80%</b> of those who test positive</td><td>2016 Manchester consensus Part 1</td></tr><tr><td class=\"rl\"><b>Patellar edge / facet tenderness</b></td><td>PFP present in <b>71–75%</b> of those with this finding (limited evidence)</td><td>2016 Manchester consensus Part 1</td></tr><tr><td class=\"rl\">Patellar grind (Clarke's test)</td><td><b>Low sensitivity, limited diagnostic accuracy</b> — not recommended</td><td>2016 Manchester consensus Part 1</td></tr><tr><td class=\"rl\">Patellar apprehension</td><td>Limited accuracy for PFP; useful for instability</td><td>2016 Manchester consensus Part 1</td></tr><tr><td class=\"rl\">Knee ROM and effusion</td><td>Limited diagnostic usefulness</td><td>2016 Manchester consensus Part 1</td></tr></tbody></table></div>\n<p class=\"note\">Sensitivity, specificity and likelihood ratios are not reported for these tests in the consensus statement — the figures above are proportions of positives with PFP, which is not the same as a likelihood ratio. Do not convert them into LRs.</p>", "Imaging & investigations": "\n<p><b>Imaging is not routinely indicated.</b> PFP is a clinical diagnosis, and PFJ imaging findings correlate poorly with symptoms.</p>\n<p><b>When to image</b></p>\n<ul>\n<li>Red flags — suspected bone stress injury, infection, malignancy</li>\n<li>Acute trauma meeting the <b>Ottawa knee rules</b></li>\n<li>True mechanical locking or recurrent effusion — consider osteochondral or meniscal lesion</li>\n<li>Failure to respond to an adequate trial of well-executed, progressively loaded exercise</li>\n<li><b>Adolescent with knee or hip pain and restricted hip internal rotation</b> — urgent pelvic imaging for SUFE</li>\n</ul>\n<p><b>Preferred modality.</b> Weight-bearing plain radiographs (including a skyline view) if PFJ OA or a bony lesion is suspected; MRI for suspected bone stress injury or osteochondral lesion.</p>\n<p><b>When to refer on.</b> Red flags, diagnostic uncertainty after thorough assessment, or suspected instability requiring surgical opinion.</p>", "Outcome measures": "<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Measure</th><th>Type</th><th>MCID</th><th>Page link</th></tr></thead><tbody><tr><td class=\"rl\">Anterior Knee Pain Scale (Kujala)</td><td>PFP-specific, 13 items, 0–100 (higher = better)</td><td>~10 points <span style=\"color:var(--amber);font-weight:700\">[verify]</span></td><td>Anterior Knee Pain Scale (Kujala)</td></tr><tr><td class=\"rl\">KOOS-PF</td><td>PFP-specific subscale, 0–100</td><td>~16 points <span style=\"color:var(--amber);font-weight:700\">[verify]</span></td><td>KOOS</td></tr><tr><td class=\"rl\">NPRS — usual and worst pain</td><td>Pain intensity, 0–10</td><td>~2 points, or 30% change <span style=\"color:var(--amber);font-weight:700\">[verify]</span></td><td>Numeric Pain Rating Scale</td></tr><tr><td class=\"rl\">Patient-Specific Functional Scale</td><td>Individualised function, 0–10</td><td>~2 points for a single activity <span style=\"color:var(--amber);font-weight:700\">[verify]</span></td><td>Patient-Specific Functional Scale</td></tr><tr><td class=\"rl\">Tampa Scale of Kinesiophobia</td><td>Fear of movement</td><td>—</td><td>Tampa Scale of Kinesiophobia</td></tr></tbody></table></div>\n<p><b>What consensus recommends.</b> The 2016 statement recommends a standard core set covering <b>pain, function and global assessment</b>, with quality of life and physical activity as optional constructs. It notes that few PROMs were developed specifically for PFP, so commonly used instruments may lack content validity.</p>\n<p><b>Prognostically useful threshold:</b> an AKPS score <b>below 70/100</b> predicted unfavourable outcome at 5–8 years (Lankhorst et al. 2015). Record it at baseline.</p>", "Management": "\n<p><b>What the 2018 consensus supports</b> (5th International Patellofemoral Pain Research Retreat, Gold Coast):</p>\n<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Intervention</th><th>Recommendation</th><th>Detail</th></tr></thead><tbody><tr><td class=\"rl\"><b>Exercise therapy</b></td><td><b>Appropriate</b></td><td>Reduces pain short, medium and long term; improves function medium and long term</td></tr><tr><td class=\"rl\"><b>Combined hip and knee exercise</b></td><td><b>Appropriate — preferred over knee exercise alone</b></td><td>Reduces pain and improves function short, medium and long term</td></tr><tr><td class=\"rl\">Combined interventions (exercise + orthoses, taping or manual therapy)</td><td><b>Appropriate</b> in adults</td><td>Reduces pain short and medium term; no evidence beyond 12 months. Uncertain for long-term pain in adolescents</td></tr><tr><td class=\"rl\"><b>Prefabricated</b> foot orthoses</td><td><b>Appropriate</b> for short-term pain</td><td>Uncertain for function. <b>Custom-fabricated orthoses are not supported</b></td></tr><tr><td class=\"rl\">Patellar taping and bracing</td><td><b>Uncertain</b></td><td>Evidence uncertain for tailored and untailored taping, and for bracing</td></tr><tr><td class=\"rl\">Manual soft tissue techniques</td><td><b>Uncertain</b></td><td>Short-term benefit uncertain</td></tr><tr><td class=\"rl\">Acupuncture / dry needling, BFR, gait retraining</td><td><b>Uncertain</b></td><td>Insufficient evidence to recommend for or against</td></tr><tr><td class=\"rl\">Patellofemoral, knee or lumbar mobilisation <b>in isolation</b></td><td><b>Inappropriate</b></td><td>PFJ mobilisation may form part of a combined approach only</td></tr><tr><td class=\"rl\">Electrophysical agents (ultrasound, phonophoresis, laser)</td><td><b>Inappropriate</b></td><td>Not recommended</td></tr></tbody></table></div>\n<p><b>Dosage.</b> The consensus explicitly states that <b>the optimal exercise dose is unknown</b> and that exercise prescription is poorly reported in the literature. The parameters below are therefore extrapolated from general strength-training principles, not from PFP-specific evidence. <span style=\"color:var(--amber);font-weight:700\">[verify]</span></p>\n<div class=\"phases\">\n<div class=\"phase\"><h4>Phase 1 · Settle and educate</h4>\n<p><b>Goals:</b> reduce pain to a tolerable level, establish understanding, modify provocative load without full rest.</p>\n<p><b>Interventions:</b> education (mandatory at the first consultation), relative load modification, isometric quadriceps work, hip abductor and external rotator activation, prefabricated orthoses if foot-related aggravation.</p>\n<p><b>Dosage <span style=\"color:var(--amber);font-weight:700\">[verify]</span>:</b> isometrics 5 × 45 s at ~70% MVC, 1–2× daily; pain during exercise acceptable up to 2–3/10 and settling within 24 h.</p>\n<p><b>Progress when:</b> pain predictable and settling within 24 h; able to perform a pain-acceptable squat to 60°.</p></div>\n<div class=\"phase\"><h4>Phase 2 · Load</h4>\n<p><b>Goals:</b> build hip and knee strength and PFJ load tolerance.</p>\n<p><b>Interventions:</b> <b>combined hip and knee strengthening</b> — the single best-supported element. Squat and leg press through a tolerable range, split squats, step-ups and step-downs, hip abduction and external rotation under load.</p>\n<p><b>Dosage <span style=\"color:var(--amber);font-weight:700\">[verify]</span>:</b> 3–4 sets × 8–12 reps at RPE 7–8, 2–3×/week, progressed weekly by load rather than reps.</p>\n<p><b>Progress when:</b> strength symmetry approaching the uninvolved side, pain-free through full functional range, AKPS improving.</p></div>\n<div class=\"phase\"><h4>Phase 3 · Return to load</h4>\n<p><b>Goals:</b> restore the specific activity the patient wants back.</p>\n<p><b>Interventions:</b> graded reintroduction of the provocative activity, plyometrics and running progression where relevant, continued strength maintenance.</p>\n<p><b>Dosage <span style=\"color:var(--amber);font-weight:700\">[verify]</span>:</b> graded exposure with 24-hour symptom response as the progression gate; strength maintained at 2×/week.</p>\n<p><b>Progress when:</b> target activity tolerated at full volume with stable 24-hour response.</p></div>\n</div>", "Education & self-management": "\n<p><b>Education is the minimum intervention.</b> Consensus is that at minimum, patients should receive education at the first consultation, and that <b>a wait-and-see approach is the least effective option for short-term outcomes and should be avoided.</b></p>\n<p><b>Key messages</b></p>\n<ul>\n<li>This is a load problem, not a damaged joint. Cartilage is not being \"worn away\" by exercise.</li>\n<li>Pain during rehabilitation is acceptable within limits and does not signal harm.</li>\n<li>Rest alone makes it worse — capacity falls while demand stays the same.</li>\n<li>Improvement takes months, not weeks. Set that expectation at the first visit.</li>\n<li>Adherence to the strength program is the main determinant of outcome.</li>\n</ul>\n<p><b>Load and activity advice.</b> Modify rather than cease: reduce depth of knee flexion under load, reduce running volume or hills, spread sitting with periodic extension. Keep the patient active in a tolerable form.</p>\n<p><b>Shared decision-making.</b> The IASP fact sheet notes no single exercise or orthosis is superior, so patient preference, time and cost can legitimately guide the choice between options.</p>", "Medical & surgical management": "\n<p><b>There is no established surgical role in uncomplicated PFP.</b> Surgery is relevant to patellar instability, osteochondral lesions and advanced PFJ osteoarthritis — all of which are different diagnoses.</p>\n<p><b>When to refer</b></p>\n<ul>\n<li>Red flags — suspected infection, malignancy, bone stress injury, SUFE</li>\n<li>Recurrent patellar dislocation or demonstrable instability</li>\n<li>Mechanical locking or a persistent effusion</li>\n<li>Failure to progress after an adequate, well-executed and progressively loaded exercise program</li>\n</ul>\n<p><b>Medical options.</b> Simple analgesia or a short NSAID course may assist participation in rehabilitation but is not a treatment for the condition. Corticosteroid injection has no established role.</p>", "Prognosis": "\n<p><b>PFP is not self-limiting.</b> This is the most commonly misunderstood aspect of the condition, and it should change how you counsel the patient.</p>\n<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Timepoint</th><th>Outcome</th><th>Source</th></tr></thead><tbody><tr><td class=\"rl\">12 months</td><td><b>40%</b> report unfavourable recovery despite evidence-based physiotherapy</td><td>Collins et al. 2013</td></tr><tr><td class=\"rl\">5–8 years</td><td><b>57%</b> report unfavourable recovery</td><td>Lankhorst et al. 2015</td></tr><tr><td class=\"rl\">Adolescents, 2 years</td><td>Up to <b>65%</b> still have pain</td><td>IASP fact sheet</td></tr><tr><td class=\"rl\">Adolescents, 5 years</td><td>Up to <b>40%</b> still have pain</td><td>IASP fact sheet</td></tr><tr><td class=\"rl\">Adolescents, 1–20 years</td><td><b>50–90%</b> report persistent symptoms</td><td>Rathleff et al.; Nimon et al.; Stathopulu &amp; Baildam</td></tr></tbody></table></div>\n<p><b>Predictors of worse outcome</b></p>\n<ul>\n<li><b>Symptom duration greater than 12 months</b> (at 5–8 years) — Lankhorst et al. 2015</li>\n<li><b>AKPS below 70/100</b> (at 5–8 years) — Lankhorst et al. 2015</li>\n<li><b>Usual or resting pain above 35/100 VAS</b> (at 12 months) — Collins et al. 2013</li>\n<li><b>Worst or activity-related pain above 60/100 VAS</b> (at 12 months) — Collins et al. 2013</li>\n</ul>\n<p><b>Clinical implication.</b> Symptom duration is the one prognostic factor you can influence by acting early. Prompt, relevant treatment at first presentation may improve long-term outcome — which is the strongest argument against wait-and-see.</p>", "Return to sport or work": "\n<p><b>Criteria, not time.</b> There is no PFP-specific validated return-to-sport battery. Progress on symptom response and capacity.</p>\n<p><b>Suggested criteria</b> <span style=\"color:var(--amber);font-weight:700\">[verify]</span></p>\n<ul>\n<li>Pain ≤2/10 during the target activity, settling within 24 hours</li>\n<li>Quadriceps and hip abductor strength symmetry within 10–15% of the uninvolved limb</li>\n<li>Pain-acceptable single-leg squat and step-down to the required depth</li>\n<li>Where jumping or running is required: symmetrical hop performance and tolerance of a graded plyometric progression</li>\n<li>AKPS improved by at least the MCID from baseline</li>\n</ul>\n<p><b>Graded return.</b> Reintroduce the provocative component last — depth of squat, hill running, jump volume — and use the 24-hour symptom response as the gate for each step up.</p>\n<p><b>Work.</b> For kneeling, squatting or stair-heavy occupations, stage the return by cumulative time in loaded flexion rather than by total hours.</p>", "Clinical pearls & exam traps": "\n<p><b>Clinical pearls</b></p>\n<ul>\n<li>Ask the patient to point with <b>one finger</b>. A whole-hand grasp over the patella supports PFP; a fingertip on the inferior pole points to patellar tendinopathy.</li>\n<li>Squatting pain is the best available test — present in roughly 80% of those who test positive.</li>\n<li><b>Prefabricated</b> orthoses are supported; <b>custom</b> orthoses are not. This catches people out in both directions.</li>\n<li>Tell the patient at visit one that this takes months. Unmet expectation drives disengagement and disengagement drives the 57% figure.</li>\n</ul>\n<p><b>Common exam traps</b></p>\n<ul>\n<li><b>Clarke's test / patellar grind.</b> Low sensitivity, limited accuracy, and unpleasant for the patient. Naming it as your diagnostic test is a mark lost.</li>\n<li><b>Any adolescent with knee pain.</b> If you do not examine the hip, you have failed the station — SUFE and Perthes both present as knee pain.</li>\n<li><b>Calling it \"chondromalacia\" or \"maltracking.\"</b> Neither is a synonym for PFP.</li>\n<li><b>Recommending rest.</b> Wait-and-see is the least effective option for short-term outcome.</li>\n<li><b>Treating a patient with a dislocation history as PFP.</b> That is patellar instability by definition.</li>\n<li><b>Knee-only strengthening.</b> Consensus prefers combined hip and knee.</li>\n</ul>\n<p><b>Viva questions</b></p>\n<ul>\n<li>\"Which single clinical test confirms PFP?\" — None. State that, then describe the pattern-plus-exclusion approach.</li>\n<li>\"Why not just rest it?\" — Capacity falls, demand is unchanged; wait-and-see performs worst short term.</li>\n<li>\"A 13-year-old with anterior knee pain — what must you not miss?\" — SUFE and Perthes. Examine the hip.</li>\n<li>\"What would you tell this patient about their prognosis?\" — Honest framing: ~40% unfavourable at 1 year, 57% at 5–8 years; early treatment and adherence are the levers.</li>\n</ul>", "Evidence summary": "\n<p><b>Clinical practice guidance.</b> Two international consensus statements from the Patellofemoral Pain Research Retreats (2016 Manchester, 2018 Gold Coast) are the primary sources, supplemented by the JOSPT clinical practice guideline and the IASP fact sheet.</p>\n<div class=\"tbl-wrap\"><table class=\"tpl live\"><thead><tr><th>Source</th><th>Design</th><th>NHMRC level</th><th>Key finding</th></tr></thead><tbody><tr><td class=\"rl\">2016 Manchester consensus, Part 1</td><td>International consensus statement</td><td>Expert consensus</td><td>Defines PFP; <b>no definitive clinical test</b>; squat pain is the best available</td></tr><tr><td class=\"rl\">2018 Gold Coast consensus</td><td>International consensus statement</td><td>Expert consensus</td><td>Exercise therapy <b>appropriate</b>; combined hip and knee preferred; electrophysical agents and isolated mobilisation <b>inappropriate</b></td></tr><tr><td class=\"rl\">Lankhorst et al. 2015</td><td>Multicentre observational cohort</td><td>III-2</td><td><b>57%</b> unfavourable at 5–8 years; duration &gt;12 months and AKPS &lt;70 predict worse outcome</td></tr><tr><td class=\"rl\">Collins et al. 2013</td><td>Multicentre observational cohort</td><td>III-2</td><td><b>40%</b> unfavourable at 12 months; baseline pain intensity predicts outcome</td></tr><tr><td class=\"rl\">Hip and knee strengthening meta-analysis (JOSPT 2018)</td><td>Systematic review with meta-analysis</td><td>I</td><td>Hip <b>and</b> knee strengthening more effective than knee alone for pain and activity</td></tr></tbody></table></div>\n<p><b>Evidence quality.</b> Intervention evidence is moderate and consistent for exercise. Diagnostic evidence is weak — no test has adequate accuracy. Aetiological evidence is weak and several long-assumed risk factors have been prospectively excluded.</p>"}, "refs": [{"cite": "Crossley KM, Stefanik JJ, Selfe J, et al. 2016 Patellofemoral pain consensus statement from the 4th International Patellofemoral Pain Research Retreat, Manchester. Part 1: Terminology, definitions, clinical examination, natural history, patellofemoral osteoarthritis and patient-reported outcome measures. Br J Sports Med. 2016;50(14):839-843.", "doi": "10.1136/bjsports-2016-096384", "design": "Consensus statement", "level": "Expert consensus", "licence": "All rights reserved", "used": "Overview; Epidemiology; Clinical presentation; Objective examination; Outcome measures"}, {"cite": "Collins NJ, Barton CJ, van Middelkoop M, et al. 2018 Consensus statement on exercise therapy and physical interventions (orthoses, taping and manual therapy) to treat patellofemoral pain: recommendations from the 5th International Patellofemoral Pain Research Retreat, Gold Coast, Australia, 2017. Br J Sports Med. 2018;52:1170-1178.", "doi": "10.1136/bjsports-2018-099397", "design": "Consensus statement", "level": "Expert consensus", "licence": "All rights reserved", "used": "Management; Education & self-management"}, {"cite": "Lankhorst NE, van Middelkoop M, Crossley KM, et al. Factors that predict a poor outcome 5-8 years after the diagnosis of patellofemoral pain: a multicentre observational analysis. Br J Sports Med. 2016;50(14):881-886.", "doi": "10.1136/bjsports-2015-094664", "design": "Multicentre observational cohort", "level": "III-2", "licence": "All rights reserved", "used": "Prognosis; Outcome measures"}, {"cite": "Collins NJ, Bierma-Zeinstra SMA, Crossley KM, et al. Prognostic factors for patellofemoral pain: a multicentre observational analysis. Br J Sports Med. 2013;47(4):227-233.", "doi": "10.1136/bjsports-2012-091696", "design": "Multicentre observational cohort", "level": "III-2", "licence": "All rights reserved", "used": "Prognosis; Subjective examination"}, {"cite": "Lack S, Barton C, Sohan O, Crossley K, Morrissey D. Proximal muscle rehabilitation is effective for patellofemoral pain: a systematic review with meta-analysis. Br J Sports Med. 2015;49(21):1365-1376.", "doi": "10.1136/bjsports-2015-094723", "design": "Systematic review with meta-analysis", "level": "I", "licence": "All rights reserved", "used": "Management"}, {"cite": "International Association for the Study of Pain. Patellofemoral Pain (PFP) Fact Sheet. IASP; 2021.", "doi": "https://www.iasp-pain.org/resources/fact-sheets/patellofemoral-pain-pfp/", "design": "Fact sheet", "level": "Expert opinion", "licence": "Check IASP terms", "used": "Epidemiology; Pathoanatomy; Prognosis; Education"}, {"cite": "Willy RW, Hoglund LT, Barton CJ, et al. Patellofemoral Pain: Clinical Practice Guidelines Linked to the ICF from the Academy of Orthopaedic Physical Therapy, APTA. J Orthop Sports Phys Ther. 2019;49(9):CPG1-CPG95.", "doi": "10.2519/jospt.2019.0302", "design": "Clinical practice guideline", "level": "Guideline", "licence": "All rights reserved", "used": "Differential diagnosis; Management — NOT YET VERIFIED, full text not retrieved"}, {"cite": "Crossley KM, Bennell KL, Cowan SM, Green S. Analysis of outcome measure   return {title:spec,type:type,flag:flag,kids:null};
}

/* ---------- Normalise the tree ---------- */
const BY = new Map(), ALL = [];
function slug(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function norm(n,parent,tab){
  n.parent = parent||null; n.tab = tab;
  if(!n.dom && parent) n.dom = parent.dom;
  if(!n.id){
    const base = (parent?parent.id+"-":"")+slug(n.title);
    let id = base, i = 2;
    while(BY.has(id)) id = base+"-"+(i++);
    n.id = id;
  }
  BY.set(n.id,n); ALL.push(n);
  n.leafCount = 0; n.pageCount = 1;
  if(n.kids) n.kids.forEach(k=>{ norm(k,n,tab); n.leafCount += k.kids ? k.leafCount : 1; n.pageCount += k.pageCount; });
}
TABS.forEach(t=>norm(t,null,t));

function ancestors(n){ const a=[]; let p=n.parent; while(p){ a.unshift(p); p=p.parent; } return a; }
function labelOf(a){ return a.type==="domain" ? DOM[a.dom].short : a.title; }
function pathText(n){ return ancestors(n).map(labelOf).join(" › "); }
function statusOf(n){ return STATUS[n.id] || (CONTENT[n.id] ? "draft" : "empty"); }
function writtenIn(n){ if(!n.kids) return statusOf(n)!=="empty"?1:0; return n.kids.reduce((a,k)=>a+writtenIn(k),0); }
function refCount(n){ const c=CONTENT[n.id]; return c && Array.isArray(c.refs) ? c.refs.length : 0; }
function walk(n,fn){ fn(n); if(n.kids) n.kids.forEach(k=>walk(k,fn)); }
function refStats(n){ let pages=0,withRefs=0,refs=0; walk(n,x=>{ pages++; const r=refCount(x); refs+=r; if(r) withRefs++; }); return {pages,withRefs,refs}; }
function tplKey(n){ if(n.type==="group") return n.tab.id==="conditions" ? "cgroup" : "collection"; return n.type; }

const NOW = new Date();
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(d){ return d ? MONTHS[d.getMonth()]+" "+d.getFullYear() : "—"; }
function newestSource(n){
  const c=CONTENT[n.id]; if(!c||!Array.isArray(c.refs)||!c.refs.length) return null;
  let y=null;
  c.refs.forEach(r=>{ const m=String(r.cite||"").match(/\b(19|20)\d{2}\b/g); if(m) m.forEach(v=>{ const n2=+v; if(n2<=NOW.getFullYear()&&(y===null||n2>y)) y=n2; }); });
  return y;
}
function evidence(n){
  const refs=refCount(n);
  if(!refs) return null;
  const rv=REVIEW[n.id], on=rv&&rv.on?new Date(rv.on):null;
  let due=null, state="unreviewed", monthsLeft=null;
  if(on){
    due=new Date(on.getTime()); due.setMonth(due.getMonth()+REVIEW_MONTHS);
    monthsLeft=(due.getFullYear()-NOW.getFullYear())*12+(due.getMonth()-NOW.getMonth());
    state = monthsLeft<0 ? "overdue" : monthsLeft<=3 ? "due" : "current";
  }
  const src=newestSource(n);
  const srcAge = src ? NOW.getFullYear()-src : null;
  return {refs,on,due,state,monthsLeft,src,srcAge,stale:srcAge!==null&&srcAge>SOURCE_STALE_YEARS,by:rv&&rv.by};
}
function evChip(n){
  const e=evidence(n); if(!e) return "";

  return `<span class="chip ${cls}">${label}</span>`+(e.src?`<span class="chip mono${e.stale?" amber":""}">Sources to ${e.src}</span>`:"");
}

function sget(k,d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

/* ---------- Search ---------- */
function searchNodes(q){
  const terms = q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  const hits=[];
  for(const n of ALL){
    if(n.type==="home") continue;
    if(!n.hay) n.hay = (n.title+" "+pathText(n)+" "+(TYPE[n.type]||"")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    if(terms.every(t=>n.hay.includes(t))){
      const tl = n.title.toLowerCase();
      const score = (tl.startsWith(terms[0])?0:tl.includes(terms[0])?1:2) + (n.kids?0.5:0);
      hits.push([score,n]);
    }
  }
  hits.sort((a,b)=>a[0]-b[0] || a[1].title.length-b[1].title.length);
  return hits.slice(0,40).map(h=>h[1]);
}
function resultsHTML(list){
  if(!list.length) return '<div class="res-empty">No pages match. Try a shorter word.</div>';
  return list.map((n,i)=>`<a class="res${i===0?" act":""}" role="option" href="#${n.id}" data-id="${n.id}"><span class="res-t">${esc(n.title)}</span><span class="res-p">${esc(TYPE[n.type]||"Page")}${pathText(n)?" · "+esc(pathText(n)):""}</span></a>`).join("");
}
function bindSearch(input,box,onPick){
  input.addEventListener("input",()=>{
    const q=input.value.trim();
    if(!q){ box.hidden=true; box.innerHTML=""; return; }
    box.innerHTML = resultsHTML(searchNodes(q)); box.hidden=false;
  });
  input.addEventListener("keydown",e=>{
    const items=[...box.querySelectorAll(".res")];
    if(e.key==="Escape"){ box.hidden=true; input.blur(); return; }
    if(box.hidden || !items.length) return;
    let i = items.findIndex(x=>x.classList.contains("act"));
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      items[i]&&items[i].classList.remove("act");
      i = e.key==="ArrowDown" ? Math.min(items.length-1,i+1) : Math.max(0,i-1);
      items[i].classList.add("act"); items[i].scrollIntoView({block:"nearest"});
    } else if(e.key==="Enter"){
      e.preventDefault(); onPick(items[Math.max(0,i)].dataset.id);
    }
  });
  box.addEventListener("click",e=>{
    const a=e.target.closest(".res"); if(!a) return;
    e.preventDefault(); onPick(a.dataset.id);
  });
  document.addEventListener("click",e=>{ if(!box.hidden && !box.contains(e.target) && e.target!==input) box.hidden=true; });
}

function slotsHTML(f){ return `<div class="slots">${f.map(x=>`<div class="slot"><span class="slot-l">${esc(x)}</span><span class="slot-h">Not written yet</span></div>`).join("")}</div>`; }

function phasesHTML(s){ return `<div class="phases">${s.phases.map(p=>`<div class="phase"><h4>${esc(p)}</h4>${s.pf.map(x=>`<div class="slot"><span class="slot-l">${esc(x)}</span><span class="slot-h">Not written yet</span></div>`).join("")}</div>`).join("")}</div>`; }

function stagesHTML(){ return STAGES.map((s,i)=>`<div class="stage"><h4><b>${i+1}</b>${esc(s[0])}</h4>${slotsHTML(s[1])}</div>`).join(""); }
function termsHTML(){ const keys=Object.keys(GLOSS).sort((a,b)=>a.localeCompare(b)); return `<p class="note">${keys.length} terms defined. These are shown as hover definitions throughout every article.</p><div class="tbl-wrap"><table class="tpl live"><thead><tr><th style="width:22%">Term</th><th>Definition</th></tr></thead><tbody>${keys.map(k=>`<tr><td class="rl">${esc(k)}</td><td>${esc(GLOSS[k].d)}</td></tr>`).join("")}</tbody></table></div>`; }
function refsTable(n){

function secHTML(n,s,i){
  const c = CONTENT[n.id] && CONTENT[n.id].sections && CONTENT[n.id].sections[s.t];
  const filled = s.refs ? refCount(n)>0 : !!c;
  let b="";
  if(c && !s.refs) b += `<div class="prose">${c}</div>`;
  else if(!s.refs){
    if(s.f) b += slotsHTML(s.f);
    if(s.table) b += tableHTML(s.table);
    if(s.phases) b += phasesHTML(s);
    if(s.video) b += videoHTML();
    if(s.chain) b += chainHTML(n);
    if(s.stages) b += stagesHTML();
    if(s.terms) b += termsHTML();
  }
  if(s.refs) b += refsTable(n);
  if(s.calc) b += '<p class="note">Interpret results with the <a href="#tests">post-test probability calculator</a>.</p>';
  if(s.mcid) b += '<p class="note">Check a patient\'s change against the MCID with the <a href="#measures">MCID checker</a>.</p>';
  const chip = s.refs ? `<span class="chip mono">${refCount(n)}</span>` : filled ? '<span class="chip acc">Written</span>' : '<span class="chip">Empty</span>';
  return `<details class="sec" id="sec-${i}"${i===0?" open":""}><summary><span class="sec-n">${i+1}</span><span class="sec-t">${esc(s.t)}</span>${chip}${SEC_CARET}</summary><div class="sec-b">${b}</div></details>`;
}

/* ---------- Tool wiring ---------- */
function num(id){ const v=parseFloat($("#"+id).value); return isFinite(v)?v:NaN; }
function fmtPct(p){ return isFinite(p) ? (p*100).toFixed(p>0.995||p<0.005?1:0)+"%" : "–"; }
function wirePostTest(){
  const root=$("#tool-pt"); if(!root) return;
  const calc=()=>{
    const mode=root.querySelector('input[name="ptm"]:checked').value;
    root.querySelectorAll("[data-m]").forEach(f=>f.hidden=f.dataset.m!==mode);
    const pre=num("pt-pre")/100;
    let lrp,lrn;
    if(mode==="snsp"){ const sn=num("pt-sn")/100, sp=num("pt-sp")/100; lrp = sp>=1 ? Infinity : sn/(1-sp); lrn = sp<=0 ? Infinity : (1-sn)/sp; }
    else { lrp=num("pt-lrp"); lrn=num("pt-lrn"); }
    const post=lr=>{ if(!(pre>=0&&pre<=1)||!(lr>=0)) return NaN; if(lr===Infinity) return 1; if(pre>=1) return 1; const o=pre/(1-pre)*lr; return o/(1+o); };
    const pp=post(lrp), pn=post(lrn);
    $("#pt-o-lrp").textContent = isFinite(lrp)?lrp.toFixed(2):lrp===Infinity?"∞":"–";
    $("#pt-o-lrn").textContent = isFinite(lrn)?lrn.toFixed(2):"–";
    $("#pt-o-pos").textContent = fmtPct(pp);
    $("#pt-o-neg").textContent = fmtPct(pn);
    const place=(id,p)=>{ const m=$("#"+id); m.hidden=!isFinite(p); if(isFinite(p)) m.style.left=(Math.min(1,Math.max(0,p))*100)+"%"; };
    place("pt-mk-pre",pre); place("pt-mk-pos",pp); place("pt-mk-neg",pn);
  };
  root.addEventListener("input",calc); calc();
}
function wireMcid(){
  const root=$("#tool-mcid"); if(!root) return;
  const calc=()=>{
    const b=num("mc-b"), f=num("mc-f"), m=Math.abs(num("mc-m")), up=$("#mc-d").value==="up";
    const ch=f-b, v=$("#mc-v");
    $("#mc-o-c").textContent = isFinite(ch) ? (ch>0?"+":"")+(+ch.toFixed(2)) : "–";
    $("#mc-o-p").textContent = isFinite(ch)&&b ? (ch/Math.abs(b)*100>0?"+":"")+(ch/Math.abs(b)*100).toFixed(0)+"%" : "–";
    if(!isFinite(ch)||!isFinite(m)){ v.textContent="Enter all three numbers."; v.className="verdict no"; return; }
    const better = up ? ch : -ch;
    if(better>=m){ v.textContent="Improvement meets or exceeds the MCID."; v.className="verdict yes"; }
    else if(better>0){ v.textContent="Improved, but by less than the MCID."; v.className="verdict no"; }
    else if(better===0){ v.textContent="No change."; v.className="verdict no"; }
    else { v.textContent = -better>=m ? "Worse by at least the MCID." : "Slightly worse, within the MCID."; v.className="verdict no"; }
  };
  root.addEventListener("input",calc); root.addEventListener("change",calc); calc();
}
function wireOneRm(){
  const root=$("#tool-rm"); if(!root) return;
  const calc=()=>{
    const w=num("rm-w"), r=Math.round(num("rm-r"));
    const ok = w>0 && r>=1;
    const ep = ok ? (r===1?w:w*(1+r/30)) : NaN;
    const bz = ok && r<37 ? (r===1?w:w*36/(37-r)) : NaN;
    const av = isFinite(bz) ? (ep+bz)/2 : ep;
    const f=x=>isFinite(x)?x.toFixed(1)+" kg":"–";
    $("#rm-e").textContent=f(ep); $("#rm-b").textContent=f(bz); $("#rm-a").textContent=f(av);
    $("#rm-t").innerHTML = [95,90,85,80,75,70,65,60,55,50].map(p=>`<tr><td class="rl" style="font-family:var(--f-mono)">${p}%</td><td class="num">${isFinite(av)?(av*p/100).toFixed(1):"–"}</td></tr>`).join("");
    $("#rm-n").textContent = r>10 ? "More than 10 reps: treat these estimates with caution." : "Estimates get less reliable above 10 reps.";
  };
  root.addEventListener("input",calc); calc();
}
function wireQbank(){
  const root=$("#tool-q"); if(!root) return;
  const meta=()=>{ $("#qb-meta").textContent=`Template question · ${$("#qb-type").value==="All types"?"Single best answer":$("#qb-type").value} · ${$("#qb-bank").value}`; };
  root.addEventListener("change",meta);

function wireCase(){
  const root=$("#tool-case"); if(!root) return;
  let cur=0;
  const show=i=>{
    cur=Math.max(0,Math.min(STAGES.length-1,i));
    root.querySelectorAll(".step").forEach((b,j)=>{ b.classList.toggle("on",j===cur); b.classList.toggle("done",j<cur); b.setAttribute("aria-selected",j===cur); });
    $("#cs-panel").innerHTML = `<div class="stage"><h4><b>${cur+1}</b>${esc(STAGES[cur][0])}</h4>${slotsHTML(STAGES[cur][1])}</div>`;
    $("#cs-prev").disabled = cur===0;
    $("#cs-next").textContent = cur===STAGES.length-1 ? "Restart case" : "Next stage";
  };
  root.addEventListener("click",e=>{
    const s=e.target.closest(".step"); if(s){ show(+s.dataset.stage); return; }
    if(e.target.closest("#cs-prev")) show(cur-1);
    if(e.target.closest("#cs-next")) show(cur===STAGES.length-1?0:cur+1);
  });
  show(0);
}
const osce = {phase:"ready",running:false,end:0,remain:0,read:2,station:8,warn:2,wake:null};
function osceDur(ph){ return Math.max(0,(ph==="reading"?osce.read:osce.station))*60000; }
function osceReset(){ osce.running=false; osce.phase="ready"; osce.remain = osceDur(osce.read>0?"reading":"station"); releaseWake(); paintOsce(); }
function releaseWake(){ try{ if(osce.wake){ osce.wake.release(); osce.wake=null; } }catch(e){} }
function osceToggle(){
  if(osce.running){ osce.running=false; osce.remain=Math.max(0,osce.end-Date.now()); releaseWake(); paintOsce(); return; }
  if(osce.phase==="ready"||osce.phase==="done"){ osce.phase = osce.read>0 ? "reading" : "station"; osce.remain = osceDur(osce.phase); }
  osce.running=true; osce.end=Date.now()+osce.remain;
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{osce.wake=l;}).catch(()=>{}); }catch(e){}
  paintOsce();
}
function osceTick(){
  if(!osce.running) return;
  osce.remain = osce.end-Date.now();
  if(osce.remain<=0){
    if(osce.phase==="reading"){ osce.phase="station"; osce.remain=osceDur("station"); osce.end=Date.now()+osce.remain; }
    else { osce.phase="done"; osce.running=false; osce.remain=0; releaseWake(); }
  }
  paintOsce();
}
function paintOsce(){
  const t=$("#os-timer"); if(!t) return;
  const secs=Math.ceil(Math.max(0,osce.remain)/1000), mm=String(Math.floor(secs/60)).padStart(2,"0"), ss=String(secs%60).padStart(2,"0");
  $("#os-clock").textContent = mm+":"+ss;
  const labels={ready:"Ready",reading:"Reading time",station:"Station",done:"Time's up"};
  $("#os-phase").textContent = labels[osce.phase]+(osce.running||osce.phase==="ready"||osce.phase==="done"?"":" · paused");
  const dur = osce.phase==="ready" ? 1 : osceDur(osce.phase==="done"?"station":osce.phase);
  $("#os-fill").style.width = (osce.phase==="ready"?0:osce.phase==="done"?100:Math.min(100,(1-osce.remain/dur)*100))+"%";
  const warn = osce.phase==="station" && osce.remain<=osce.warn*60000;
  t.className = "timer"+(osce.phase==="reading"?" reading":"")+(warn?" warn":"")+(osce.phase==="done"?" done":"");
  $("#os-start").textContent = osce.running ? "Pause" : osce.phase==="ready" ? "Start" : osce.phase==="done" ? "Restart" : "Resume";
}
setInterval(osceTick,200);
function wireOsce(){
  const root=$("#tool-osce"); if(!root) return;
  $("#os-read").value=osce.read; $("#os-station").value=osce.station; $("#os-warn").value=osce.warn;
  root.addEventListener("input",e=>{
    if(!e.target.matches("input")) return;
    const v=parseFloat(e.target.value); if(!isFinite(v)||v<0) return;
    if(e.target.id==="os-read") osce.read=v; if(e.target.id==="os-station") osce.station=Math.max(0.5,v); if(e.target.id==="os-warn") osce.warn=v;
    if(!osce.running && (osce.phase==="ready"||osce.phase==="done")) osceReset(); else paintOsce();
  });
  $("#os-start").addEventListener("click",osceToggle);
  $("#os-reset").addEventListener("click",osceReset);
  if(osce.phase==="ready" && !osce.running) osce.remain = osceDur(osce.read>0?"reading":"station");
  paintOsce();

function deckFor(n){
  if(!n) return "Physio Atlas";
  const parts=[...ancestors(n),n].filter(a=>a.id!=="conditions").map(labelOf);
  return ["Physio Atlas"].concat(parts).join("::");
}
function tagsFor(n){
  if(!n) return "PhysioAtlas";
  const parts=[...ancestors(n)].filter(a=>a.id!=="conditions").map(labelOf).map(s=>s.replace(/&/g,"and").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,""));
  const tags=["PhysioAtlas"]; if(parts.length) tags.push("PhysioAtlas::"+parts.join("::"));
  if(n.flag==="red") tags.push("must-not-miss");
  return tags.join(" ");
}
function fmt(text){ return esc(text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\r?\n/g,"<br>"); }
function plain(text){ return text.replace(/\*\*/g,"").replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g,"$1").replace(/\s+/g," ").trim(); }
function clozeFront(text){ return fmt(text).replace(/\{\{c\d+::(.*?)(::(.*?))?\}\}/g,(m,a,b,h)=>`<span class="cz">[${h?esc(h):"…"}]</span>`); }
function clozeBack(text){ return fmt(text).replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g,'<span class="cz">$1</span>'); }
function ready(c){ return c.type==="cloze" ? /\{\{c\d+::/.test(c.front) : c.front.trim()!=="" && c.back.trim()!==""; }
function tsvField(s){ s=String(s).replace(/\t/g," "); return /"/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportText(){
  const lines=["#separator:Tab","#html:true","#notetype column:1","#deck column:2","#tags column:5"];
  cards.filter(ready).forEach(c=>{ lines.push([NOTETYPE[c.type],c.deck,fmt(c.front),fmt(c.back),c.tags].map(tsvField).join("\t")); });
  return lines.join("\n")+"\n";
}

    while((m=GRE.exec(text))){
      const key=GMAP.get(m[0].toLowerCase());
      if(!key||used.has(key)) continue;
      used.add(key);
      out=out||document.createDocumentFragment();
      if(m.index>last) out.appendChild(document.createTextNode(text.slice(last,m.index)));
      const sp=document.createElement("span");
      sp.className="gl"; sp.tabIndex=0; sp.dataset.g=key; sp.setAttribute("role","button");
      sp.setAttribute("aria-label",m[0]+" — show definition");
      sp.textContent=m[0];
      out.appendChild(sp); last=m.index+m[0].length;
    }
    if(out){ if(last<text.length) out.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(out,node); }
  });
}
let gpop=null, gcur=null;
function hideGloss(){ if(gpop){ gpop.remove(); gpop=null; } gcur=null; }
function showGloss(el){
  const g=GLOSS[el.dataset.g]; if(!g) return;
  if(gcur===el) return;
  hideGloss(); gcur=el;
  gpop=document.createElement("div");
  gpop.className="gpop"; gpop.setAttribute("role","tooltip");
  gpop.innerHTML=`<b>${esc(el.dataset.g)}</b>${esc(g.d)}<a href="#${GLOSS_PAGE}">Open glossary</a>`;
  document.body.appendChild(gpop);
  const r=el.getBoundingClientRect(), pw=gpop.offsetWidth, ph=gpop.offsetHeight;
  let left=r.left+window.scrollX+r.width/2-pw/2;
  left=Math.max(12+window.scrollX,Math.min(left,window.scrollX+document.documentElement.clientWidth-pw-12));
  let top=r.bottom+window.scrollY+8;
  if(r.bottom+ph+16>window.innerHeight && r.top-ph-8>0) top=r.top+window.scrollY-ph-8;
  gpop.style.left=left+"px"; gpop.style.top=top+"px";
}
document.addEventListener("mouseover",e=>{ const g=e.target.closest(".gl"); if(g) showGloss(g); else if(gpop&&!e.target.closest(".gpop")) hideGloss(); });
document.addEventListener("focusin",e=>{ const g=e.target.closest&&e.target.closest(".gl"); if(g) showGloss(g); });
document.addEventListener("click",e=>{ const g=e.target.closest(".gl"); if(g){ e.preventDefault(); gcur===g?hideGloss():showGloss(g); } else if(!e.target.closest(".gpop")) hideGloss(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideGloss(); });
window.addEventListener("scroll",hideGloss,{passive:true});
window.addEventListener("resize",hideGloss);

/* ---------- Main render & routing ---------- */
function renderMain(){
  const n=state.active;
  if(n.type==="home") main.innerHTML = homeHTML();
  else if(n.type==="refs") main.innerHTML = refsHTML();
  else if(n.type==="anki"){ main.innerHTML = ankiHTML(); wireAnki(); }
  else { main.innerHTML = pageHTML(n); if(n.tool) wireTool(n.tool); }
  hideGloss();
  main.querySelectorAll(".prose").forEach(markGloss);
}
main.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="anki"){ ankiCtx=a.dataset.id; sset(CTX_KEY,ankiCtx); location.hash="anki"; }
  else if(act==="expand") main.querySelectorAll("details.sec").forEach(d=>d.open=true);
  else if(act==="collapse") main.querySelectorAll("details.sec").forEach(d=>d.open=false);
  else if(act==="toc"){ const d=document.getElementById("sec-"+a.dataset.sec); if(d){ d.open=true; d.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"}); } }
});
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const n=BY.get(id)||BY.get("home");
  state.active=n;
  ancestors(n).forEach(a=>expanded.add(a.id));
  if(n.kids) expanded.add(n.id);
  renderTabs(); renderSide(false); renderMain(); closeDrawer();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
const topEl=$("#top");
function setTopH(){ document.documentElement.style.setProperty("--top-h",topEl.offsetHeight+"px"); }
window.addEventListener("resize",setTopH);
setTopH();
route();
getDownloads();
})();
